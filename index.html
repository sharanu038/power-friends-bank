          <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${METRIC_COLORS.outstanding}" stroke-width="${sw}"
            stroke-dasharray="${loanDash}" stroke-dashoffset="${loanOffset}" transform="rotate(-90 ${cx} ${cy})" stroke-linecap="butt"/>
          ` : ''}
        </svg>
        <div style="font-size:13px; flex:1; min-width:120px;">
          <div style="display:flex; align-items:center; gap:6px; margin-bottom:8px;">
            <span style="width:12px; height:12px; border-radius:3px; background:${METRIC_COLORS.cashInHand}; flex:0 0 auto;"></span>
            <span style="color:var(--muted); flex:1;">Cash in hand</span>
            <span class="num" style="font-weight:700; color:var(--ink);">${donutTotal>0 ? Math.round(cashFrac*100) : 0}%</span>
          </div>
          <div style="display:flex; align-items:center; gap:6px;">
            <span style="width:12px; height:12px; border-radius:3px; background:${METRIC_COLORS.outstanding}; flex:0 0 auto;"></span>
            <span style="color:var(--muted); flex:1;">Outstanding loans</span>
            <span class="num" style="font-weight:700; color:var(--ink);">${donutTotal>0 ? Math.round(loanFrac*100) : 0}%</span>
          </div>
        </div>
      </div>`;
    wrap.appendChild(donutBox);

    // 2. NAV Growth Column Chart
    const trendBox = document.createElement('div');
    trendBox.style.cssText = 'background:var(--paper-2); backdrop-filter:var(--glass-filter); -webkit-backdrop-filter:var(--glass-filter); border-radius:10px; padding:14px 16px; flex:1; min-width:220px; border:1px solid var(--rule);';
    const trendTitle = document.createElement('p');
    trendTitle.style.cssText = 'font-size:12px; letter-spacing:.02em; color:var(--muted); margin:0 0 10px; font-weight:700;';
    trendTitle.textContent = '6-Month NAV Growth';
    trendBox.appendChild(trendTitle);

    const last6Months = orderedMonths().slice(-6);
    const nav6Points = last6Months.map(k => {
      const sm = summary(k);
      return { monthText: monthShortText(k), nav: sm ? safe(Math.round(sm.nav)) : 0 };
    });

    const rawNavs = nav6Points.map(p => p.nav);
    const minRaw = Math.min(...rawNavs);
    const maxRaw = Math.max(...rawNavs);
    const navSpread = (maxRaw - minRaw) || 10;

    const yMin = Math.max(0, Math.floor(minRaw - navSpread * 0.25));
    const yMax = Math.ceil(maxRaw + navSpread * 0.20) || 1;
    const yRange = (yMax - yMin) || 1;

    let columnsSvg = '';
    columnsSvg += `
      <line x1="0" y1="30" x2="200" y2="30" stroke="var(--rule)" stroke-width="1" stroke-dasharray="2 2"/>
      <line x1="0" y1="65" x2="200" y2="65" stroke="var(--rule)" stroke-width="1" stroke-dasharray="2 2"/>
      <line x1="0" y1="100" x2="200" y2="100" stroke="var(--rule)" stroke-width="1" stroke-dasharray="2 2"/>
    `;

    nav6Points.forEach((p, idx) => {
      const norm = (p.nav - yMin) / yRange;
      const barH = Math.max(12, safe(norm * 70));
      const x = idx * 32 + 10;
      const y = 110 - barH;

      columnsSvg += `
        <text x="${x+10}" y="${y - 6}" font-size="10" font-weight="800" fill="var(--ink)" text-anchor="middle">₹${p.nav}</text>
        <rect x="${x}" y="${y}" width="20" height="${barH}" rx="4" fill="${METRIC_COLORS.nav}"/>
        <text x="${x+10}" y="126" font-size="9" font-weight="600" fill="var(--muted)" text-anchor="middle">${p.monthText}</text>
      `;
    });

    trendBox.innerHTML += `
      <svg viewBox="0 0 200 135" style="width:100%; height:140px;">
        ${columnsSvg}
      </svg>`;
    wrap.appendChild(trendBox);

    // 3. INFLOWS, OUTFLOWS & CASH IN HAND CHART (150% FONT SCALED, DYNAMIC MAX SPACE COVERAGE)
    const divBox = document.createElement('div');
    divBox.style.cssText = 'background:var(--paper-2); backdrop-filter:var(--glass-filter); -webkit-backdrop-filter:var(--glass-filter); border-radius:10px; padding:14px 16px; width:100%; border:1px solid var(--rule); margin-top:8px;';
    const divTitle = document.createElement('p');
    divTitle.style.cssText = 'font-size:12px; letter-spacing:.02em; color:var(--muted); margin:0 0 8px; font-weight:700;';
    divTitle.textContent = '6-Month Inflows, Outflows & Cash in Hand';
    divBox.appendChild(divTitle);

    const flowData = last6Months.map(k => {
      const sm = summary(k);
      const l = state.ledgers[k];
      const loanBorrowers = state.members
        .filter(m => l && l.entries[m.id] && safe(l.entries[m.id].newLoanIssued) > 0)
        .map(m => m.name);

      return {
        monthText: monthShortText(k),
        grandTotal: safe(sm ? sm.grandTotal : 0),
        thrift: safe(sm ? sm.totalPremium : 0),
        refund: safe(sm ? sm.totalRefund : 0),
        interest: safe(sm ? sm.totalInterest : 0),
        newLoans: safe(sm ? sm.totalNewLoans : 0),
        borrowers: loanBorrowers.join(', '),
        dividend: safe(sm ? sm.totalDividend : 0),
        cashInHand: safe(sm ? sm.cashInHand : 0)
      };
    });

    const maxInflowVal = Math.max(...flowData.map(d => d.thrift + d.refund + d.interest), 1);
    const maxOutflowVal = Math.max(...flowData.map(d => d.newLoans + d.dividend), 1);
    const maxCashVal = Math.max(...flowData.map(d => d.cashInHand), 1);

    // Dynamic Y-axis: round the current data's max up to a "nice" number so the
    // axis (and therefore every bar's scale) adapts to whatever range this
    // month's figures actually span, instead of a fixed scale that can flatten
    // small changes or clip large ones.
    const inflowAxisMax = niceCeil(Math.max(maxInflowVal, maxCashVal));
    const outflowAxisMax = niceCeil(maxOutflowVal);

    // Expanded Viewport with Dynamic Maximum Vertical Space Coverage
    const svgWidth = 360, svgHeight = 260, zeroY = 125, barWidth = 28, leftMargin = 36;
    const colStep = (svgWidth - leftMargin - 14) / Math.max(flowData.length, 1);
    const inflowPxSpan = 85, outflowPxSpan = 70;

    let chartElements = '';
    let trendPoints = [];

    // Dynamic Horizontal Grid Lines — 4 ticks scaled to inflowAxisMax above the
    // zero line, 2 ticks scaled to outflowAxisMax below it, each labelled with
    // its real rupee value so the axis reflects the current data range.
    [0.25, 0.5, 0.75, 1].forEach(frac=>{
      const y = zeroY - frac * inflowPxSpan;
      chartElements += `<line x1="${leftMargin}" y1="${y}" x2="${svgWidth}" y2="${y}" stroke="var(--rule)" stroke-width="1" stroke-dasharray="2 2"/>`;
      chartElements += `<text x="${leftMargin - 4}" y="${y + 3}" font-size="8.5" font-weight="600" fill="var(--muted)" text-anchor="end">${fmtShort(frac * inflowAxisMax)}</text>`;
    });
    [0.5, 1].forEach(frac=>{
      const y = zeroY + frac * outflowPxSpan;
      chartElements += `<line x1="${leftMargin}" y1="${y}" x2="${svgWidth}" y2="${y}" stroke="var(--rule)" stroke-width="1" stroke-dasharray="2 2"/>`;
      chartElements += `<text x="${leftMargin - 4}" y="${y + 3}" font-size="8.5" font-weight="600" fill="var(--muted)" text-anchor="end">${fmtShort(frac * outflowAxisMax)}</text>`;
    });
    chartElements += `<line x1="0" y1="${zeroY}" x2="${svgWidth}" y2="${zeroY}" stroke="var(--rule-strong)" stroke-width="2"/>`;

    flowData.forEach((d, idx) => {
      const x = Math.round(idx * colStep + leftMargin + 6);
      const cx = x + barWidth / 2;

      // Inflow Bars (Grow Upwards from zeroY), scaled against the dynamic axis max
      const hThrift = d.thrift > 0 ? Math.max(5, Math.round((d.thrift / inflowAxisMax) * inflowPxSpan)) : 0;
      const hRefund = d.refund > 0 ? Math.max(5, Math.round((d.refund / inflowAxisMax) * inflowPxSpan)) : 0;
      const hInterest = d.interest > 0 ? Math.max(5, Math.round((d.interest / inflowAxisMax) * inflowPxSpan)) : 0;

      const yThrift = zeroY - hThrift;
      const yRefund = yThrift - hRefund;
      const yInterest = yRefund - hInterest;

      if(hThrift > 0) chartElements += `<rect x="${x}" y="${yThrift}" width="${barWidth}" height="${hThrift}" fill="#7C3AED" rx="2"/>`;
      if(hRefund > 0) chartElements += `<rect x="${x}" y="${yRefund}" width="${barWidth}" height="${hRefund}" fill="#059669" rx="2"/>`;
      if(hInterest > 0) chartElements += `<rect x="${x}" y="${yInterest}" width="${barWidth}" height="${hInterest}" fill="#D97706" rx="2"/>`;

      // Grand Total Label with 150% Font Scaling (14.25px)
      const topInflowY = yInterest < zeroY ? yInterest : zeroY;
      const labelY = Math.max(16, topInflowY - 6);
      if(d.grandTotal > 0) {
        chartElements += `<text x="${cx}" y="${labelY}" font-size="14.25" font-weight="800" fill="#7C3AED" text-anchor="middle">${fmtShort(d.grandTotal)}</text>`;
      }

      // Outflow Bars (Grow Downwards from zeroY), scaled against the dynamic axis max
      const hNewLoans = d.newLoans > 0 ? Math.max(5, Math.round((d.newLoans / outflowAxisMax) * outflowPxSpan)) : 0;
      const hDividend = d.dividend > 0 ? Math.max(5, Math.round((d.dividend / outflowAxisMax) * outflowPxSpan)) : 0;

      const yNewLoans = zeroY;
      const yDividend = yNewLoans + hNewLoans;

      if(hNewLoans > 0) chartElements += `<rect x="${x}" y="${yNewLoans}" width="${barWidth}" height="${hNewLoans}" fill="#E23F5D" rx="2"/>`;
      if(hDividend > 0) chartElements += `<rect x="${x}" y="${yDividend}" width="${barWidth}" height="${hDividend}" fill="#0284C7" rx="2"/>`;

      // Outflow Figures with 150% Font Size (14.25px / 12px)
      const bottomOutflowY = yDividend + hDividend;
      if(d.newLoans > 0) {
        chartElements += `<text x="${cx}" y="${bottomOutflowY + 16}" font-size="14.25" font-weight="800" fill="#E23F5D" text-anchor="middle">${fmtShort(d.newLoans)}</text>`;
        if(d.borrowers) {
          chartElements += `<text x="${cx}" y="${bottomOutflowY + 28}" font-size="11" font-weight="600" fill="var(--muted)" text-anchor="middle">(${d.borrowers})</text>`;
        }
      }

      // Month Text
      chartElements += `<text x="${cx}" y="252" font-size="14" font-weight="800" fill="var(--ink)" text-anchor="middle">${d.monthText}</text>`;

      // Cash in Hand Line Node (Yellow Color Node), scaled against the dynamic axis max
      const nodeY = Math.round(zeroY - (d.cashInHand / inflowAxisMax) * inflowPxSpan);
      const safeNodeY = Math.max(20, Math.min(zeroY - 5, nodeY));
      trendPoints.push(`${cx},${safeNodeY}`);
      chartElements += `<circle cx="${cx}" cy="${safeNodeY}" r="4.5" fill="#EAB308" stroke="#FFFFFF" stroke-width="1.5"/>`;
      chartElements += `<text x="${cx}" y="${safeNodeY - 7}" font-size="13.5" font-weight="800" fill="#D97706" text-anchor="middle">${fmtShort(d.cashInHand)}</text>`;
    });

    if(trendPoints.length > 0) {
      chartElements += `<polyline fill="none" stroke="#EAB308" stroke-width="2.5" stroke-dasharray="3 3" points="${trendPoints.join(' ')}"/>`;
    }

    divBox.innerHTML += `
      <svg viewBox="0 0 ${svgWidth} ${svgHeight}" style="width:100%; height:260px;">
        ${chartElements}
      </svg>
      <div style="display:flex; flex-wrap:wrap; gap:12px; font-size:11px; font-weight:600; color:var(--muted); margin-top:10px; justify-content:center;">
        <span><span style="display:inline-block;width:10px;height:10px;background:#7C3AED;border-radius:2px;"></span> Thrift</span>
        <span><span style="display:inline-block;width:10px;height:10px;background:#059669;border-radius:2px;"></span> Refund</span>
        <span><span style="display:inline-block;width:10px;height:10px;background:#D97706;border-radius:2px;"></span> Interest</span>
        <span><span style="display:inline-block;width:10px;height:10px;background:#E23F5D;border-radius:2px;"></span> New Loans</span>
        <span><span style="display:inline-block;width:10px;height:10px;background:#0284C7;border-radius:2px;"></span> Dividend</span>
        <span><span style="display:inline-block;width:10px;height:10px;background:#EAB308;border-radius:50%;"></span> Cash in Hand</span>
      </div>`;

    wrap.appendChild(divBox);
    body.appendChild(wrap);
  }

  function renderDashboard(body){
    body.innerHTML = '';
    const s = summary(state.currentMonth);

    const allMonths = orderedMonths();
    const curIndex = allMonths.indexOf(state.currentMonth);
    let navGrowthBadge = '';
    let bookValueGrowthBadge = '';

    if(curIndex > 0){
      const prevMonthKey = allMonths[curIndex - 1];
      const prevSummary = summary(prevMonthKey);
      if(prevSummary){
        if(prevSummary.nav > 0){
          const diffNav = s.nav - prevSummary.nav;
          const pctNav = ((diffNav / prevSummary.nav) * 100).toFixed(1);
          navGrowthBadge = diffNav >= 0
            ? `<span style="color:var(--teal); font-size:11px; font-weight:700;">▲ +${pctNav}%</span>`
            : `<span style="color:var(--clay); font-size:11px; font-weight:700;">▼ ${pctNav}%</span>`;
        }
        if(prevSummary.bookValue > 0){
          const diffBV = s.bookValue - prevSummary.bookValue;
          const pctBV = ((diffBV / prevSummary.bookValue) * 100).toFixed(1);
          bookValueGrowthBadge = diffBV >= 0
            ? `<span style="color:var(--teal); font-size:11px; font-weight:700;">▲ +${pctBV}%</span>`
            : `<span style="color:var(--clay); font-size:11px; font-weight:700;">▼ ${pctBV}%</span>`;
        }
      }
    }

    const pendingNowDash = pendingPaymentCount();
    const h = document.createElement('div');
    h.innerHTML = `<div style="display:flex; justify-content:space-between; align-items:baseline; margin-bottom:1rem; flex-wrap:wrap; gap:6px;">
        <span style="color:var(--muted); font-size:13px;">${monthLabel(state.currentMonth)} · Open Period</span>
        <span style="color:var(--muted); font-size:12px; font-weight:600; text-align:right;">
          ${window.__loggedInMemberName ? `Logged in as ${window.__loggedInMemberName} · ` : ''}${s.activeCount} active member${s.activeCount===1?'':'s'}${pendingNowDash>0 ? ` · <span style="color:var(--clay);">${pendingNowDash} pending payment${pendingNowDash===1?'':'s'}</span>` : ''}
        </span>
      </div>`;
    body.appendChild(h);

    if(state.members.length===0){
      const empty = document.createElement('div');
      empty.style.cssText = 'text-align:center; padding:3rem 1rem; color:var(--muted); border:1px dashed var(--rule-strong); border-radius:10px;';
      empty.innerHTML = `<p style="margin:0 0 12px; font-style:italic;">No members yet — add your friends to start the ledger.</p>`;
      const btn = document.createElement('button'); btn.className='primary'; btn.textContent='Add members';
      btn.onclick = ()=>{ state.view='members'; render(); };
      empty.appendChild(btn);
      body.appendChild(empty);
      return;
    }

    const l = state.ledgers[state.currentMonth];
    const row1 = document.createElement('div');
    row1.style.cssText = 'display:flex; gap:12px; margin-bottom:12px; flex-wrap:wrap;';

    const bookValueCard = card('Book value', INR(s.bookValue), METRIC_COLORS.bookValue, null, null, bookValueGrowthBadge);
    const cashInHandCard = card('Cash in hand', INR(s.cashInHand), METRIC_COLORS.cashInHand);
    const navCard = card('NAV per member', INR(s.nav), METRIC_COLORS.nav, null, null, navGrowthBadge);
    const outstandingCard = card('Outstanding loans', INR(s.totalOutstanding), METRIC_COLORS.outstanding, s.outstandingLoanCount);
    const totalDividendCard = card('Total dividend declared', INR(s.totalDividend), METRIC_COLORS.totalDividend);

    row1.appendChild(bookValueCard);
    row1.appendChild(cashInHandCard);
    row1.appendChild(navCard);
    row1.appendChild(outstandingCard);
    row1.appendChild(totalDividendCard);
    body.appendChild(row1);

    const newLoanNames = state.members
      .filter(m => l.entries[m.id] && safe(l.entries[m.id].newLoanIssued) > 0)
      .map(m => m.name);

    renderMergedMetricsBar(body, s, newLoanNames);

    renderDashboardCharts(body, s);

    const cih = document.createElement('div');
    cih.style.cssText = 'display:flex; align-items:center; gap:8px; margin-bottom:8px;';
    if(l.openingCashLocked || !window.isAdmin){
      cih.innerHTML = `<label style="font-size:13px; color:var(--muted); font-style:italic;">Opening cash (carried forward)</label>
        <span class="num" style="color:var(--muted);">${INR(l.openingCash)}</span>`;
    } else {
      cih.innerHTML = `<label style="font-size:13px; color:var(--muted); font-style:italic;">Opening cash (previous cash in hand, initial setup)</label>`;
      const inp = document.createElement('input'); inp.type='number'; inp.value = l.openingCash;
      let openingCashCommitTimer = null;
      inp.oninput = (e)=>{
        l.openingCash = rupee(e.target.value);
        clearTimeout(openingCashCommitTimer);
        openingCashCommitTimer = setTimeout(()=>{ persistLedger(state.currentMonth); }, 400);
      };
      inp.onblur = ()=>{ persistLedger(state.currentMonth); render(); };
      cih.appendChild(inp);
    }
    body.appendChild(cih);

    if(window.isAdmin && !l.closed){
      const resetRow = document.createElement('div');
      resetRow.style.cssText = 'margin-bottom:12px;';
      const resetBtn = document.createElement('button');
      resetBtn.className = 'ghost';
      resetBtn.style.color = 'var(--clay)';
      resetBtn.textContent = 'Reset this month to last closed month';
      resetBtn.title = 'Discards all unsaved edits made to the current open month (including any bad member-add data) and rebuilds it fresh from the last closed month.';
      let resetArmed = false;
      resetBtn.onclick = async ()=>{
        if(!resetArmed){
          resetArmed = true;
          resetBtn.textContent = 'Confirm reset? This discards all edits made this month';
          resetBtn.style.background = 'var(--clay)';
          resetBtn.style.color = '#fff';
          setTimeout(()=>{
            if(resetArmed){ resetArmed=false; resetBtn.textContent='Reset this month to last closed month'; resetBtn.style.background=''; resetBtn.style.color='var(--clay)'; }
          }, 5000);
          return;
        }
        delete state.ledgers[state.currentMonth];
        ensureCurrentMonthLedger();
        await persistLedger(state.currentMonth);
        render();
      };
      resetRow.appendChild(resetBtn);
      body.appendChild(resetRow);
    }

    const maxDivLine = document.createElement('div');
    maxDivLine.style.cssText = 'display:flex; align-items:center; gap:8px; margin-bottom:8px;';
    maxDivLine.innerHTML = `<label style="font-size:13px; color:var(--muted); font-style:italic;">Max dividend declarable per member (for ${s.noLoanMemberCount} member(s) with no loan)</label>
      <span class="num" style="color:var(--ink); font-weight:700;">${INR(s.maxDividendPerMember)}</span>`;
    body.appendChild(maxDivLine);

    if(window.isAdmin){
      const divBox = document.createElement('div');
      divBox.style.cssText = 'display:flex; align-items:center; gap:8px; margin-bottom:8px; flex-wrap:wrap;';
      const label = document.createElement('label');
      label.style.cssText = 'font-size:13px; color:var(--muted); font-style:italic;';
      label.textContent = s.totalDividend > 0 ? 'Dividend per member (declared)' : 'Declare dividend per member';
      const divInp = document.createElement('input');
      divInp.type = 'number';
      divInp.value = l.dividendPerMember || 0;
      divInp.style.width = '110px';
      const declareBtn = document.createElement('button');
      declareBtn.className = 'primary';
      declareBtn.textContent = s.totalDividend > 0 ? 'Update dividend' : 'Declare dividend';
      const divMsg = document.createElement('span');
      divMsg.style.cssText = 'font-size:12px; color:var(--clay); font-style:italic; width:100%; margin-top:4px;';

      declareBtn.onclick = async ()=>{
        const perMember = rupee(divInp.value);
        if(perMember > s.maxDividendPerMember){
          divMsg.textContent = `Entered value exceeds Max Dividend Declarable (${INR(s.maxDividendPerMember)}).`;
          return;
        }
        divMsg.textContent = '';
        l.dividendPerMember = perMember;
        await persistFromMonth(state.currentMonth);
        render();
      };
      divBox.appendChild(label);
      divBox.appendChild(divInp);
      divBox.appendChild(declareBtn);
      divBox.appendChild(divMsg);
      body.appendChild(divBox);
    }

    const note = document.createElement('p');
    note.style.cssText = 'font-size:12px; color:var(--muted); font-style:italic; margin:0;';
    note.textContent = 'Book value = outstanding loans + cash in hand. NAV = book value ÷ active members. Max dividend declarable per member = Cash in hand ÷ active members who carry no current loan.';
    body.appendChild(note);
  }

  function renderLedger(body){
    body.innerHTML = '';
    ensureCurrentMonthLedger();
    if(!state.viewingMonth) state.viewingMonth = state.currentMonth;
    const months = orderedMonths();
    if(!months.includes(state.viewingMonth)) state.viewingMonth = state.currentMonth;
    const viewKey = state.viewingMonth;
    const isCurrent = viewKey === state.currentMonth;
    const l = state.ledgers[viewKey];
    const idx = months.indexOf(viewKey);
    const prevKey = idx > 0 ? months[idx - 1] : null;
    const nextKey = idx < months.length - 1 ? months[idx + 1] : null;

    const isDraftEditing = window.isAdmin && !isCurrent && ledgerEdit.month === viewKey;
    const isEditing = window.isAdmin && (isCurrent || isDraftEditing);
    if(isDraftEditing && !ledgerEdit.entries){
      ledgerEdit.entries = {};
      state.members.forEach(m=>{ if(l.entries[m.id]) ledgerEdit.entries[m.id] = {...l.entries[m.id]}; });
      ledgerEdit.rate = state.interestRate;
    }
    const viewEntries = isDraftEditing ? ledgerEdit.entries : l.entries;

    function draftSummary(){
      if(!isDraftEditing) return summary(viewKey);
      let totalPremium=0, totalInterest=0, totalRefund=0, totalNewLoans=0, totalCollected=0, totalOutstanding=0, totalPrevBalance=0, activeCount=0;
      let totalDividendAppliedToLoans=0, totalDividendPaidCash=0, totalExitPayouts=0, dividendEligibleCount=0;
      const perMemberDividend = rupee(l.dividendPerMember || 0);
      state.members.forEach(m=>{
        const e = viewEntries[m.id]; if(!e) return;
        totalPremium += m.active ? entryPremium(e) : 0;
        totalInterest += safe(e.interest);
        totalRefund += safe(e.loanRefund);
        totalNewLoans += safe(e.newLoanIssued);
        totalCollected += safe(e.totalCollected);
        totalPrevBalance += safe(e.previousLoanBalance);
        totalExitPayouts += safe(e.exitPayout);
        if(m.active) activeCount++;

        const dividendEligible = m.active && !!e.carried;
        if(dividendEligible) dividendEligibleCount++;
        const appliedToLoan = dividendEligible ? dividendAppliedToLoan(e.finalLoanBalance, perMemberDividend) : 0;
        const paidCash = dividendEligible ? rupee(perMemberDividend - appliedToLoan) : 0;
        totalDividendAppliedToLoans += appliedToLoan;
        totalDividendPaidCash += paidCash;
        totalOutstanding += rupee(e.finalLoanBalance - appliedToLoan);
      });
      totalDividendAppliedToLoans = rupee(totalDividendAppliedToLoans);
      totalDividendPaidCash = rupee(totalDividendPaidCash);
      totalExitPayouts = rupee(totalExitPayouts);
      const totalDividend = rupee(perMemberDividend * dividendEligibleCount);
      const openingCash = rupee(l.openingCash);
      const grandTotal = rupee(openingCash + totalCollected);
      const cashInHand = rupee(grandTotal - totalNewLoans - totalDividendPaidCash - totalExitPayouts);
      const cashFlow = rupee(totalCollected - totalNewLoans - totalDividendPaidCash - totalExitPayouts);
      const bookValue = rupee(totalOutstanding + cashInHand);
      const nav = activeCount > 0 ? bookValue / activeCount : 0;
      return {totalPremium, totalInterest, totalRefund, totalNewLoans, totalCollected, totalOutstanding, totalPrevBalance,
        openingCash, grandTotal, cashInHand, cashFlow, bookValue, nav, activeCount, dividendPerMember: perMemberDividend,
        totalDividend, totalDividendAppliedToLoans, totalDividendPaidCash, totalExitPayouts};
    }

    const head = document.createElement('div');
    head.style.cssText = 'display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem; gap:8px;';

    const titleEl = document.createElement('h3');
    titleEl.style.cssText = 'font-size:18px; font-weight:800; margin:0; color:var(--ink);';
    titleEl.innerHTML = `${monthLabel(viewKey)} <span style="font-size:12px; font-weight:400; font-style:italic; color:var(--muted);">· ${isCurrent ? 'open' : 'closed'}</span>`;
    head.appendChild(titleEl);

    if(isCurrent){
      const pendingNow = pendingPaymentCount();
      const pendingBadge = document.createElement('span');
      pendingBadge.style.cssText = `font-size:12px; font-weight:700; padding:4px 10px; border-radius:999px; background:${pendingNow>0 ? 'var(--clay-light)' : 'var(--teal-light)'}; color:${pendingNow>0 ? 'var(--clay)' : 'var(--teal)'};`;
      pendingBadge.textContent = pendingNow>0 ? `${pendingNow} pending` : 'All paid';
      head.appendChild(pendingBadge);
    }

    body.appendChild(head);

    if(!isCurrent){
      const roNote = document.createElement('p');
      roNote.style.cssText = 'font-size:12px; color:var(--muted); font-style:italic; margin:0 0 12px;';
      roNote.textContent = isEditing
        ? "Editing closed month. Click save symbol below to apply."
        : "Viewing closed month. Click edit symbol below to adjust.";
      body.appendChild(roNote);
    }

    if(state.members.length===0){
      const msg = document.createElement('p');
      msg.style.cssText = 'color:var(--muted); font-style:italic;';
      msg.textContent = 'Add members first, on the Members tab.';
      body.appendChild(msg);
      return;
    }

    const wrap = document.createElement('div');
    wrap.style.cssText = 'overflow-x:auto; -webkit-overflow-scrolling:touch; width:100%;';
    const table = document.createElement('table');
    const thead = document.createElement('thead');
    thead.innerHTML = `<tr>
      <th>#</th><th>Name</th><th>Premium</th><th>Previous balance</th><th>Interest</th>
      <th>Loan refund</th><th>New loan</th><th>Total collected</th><th>Dividend</th><th>Final balance</th><th>Remarks</th>
    </tr>`;
    table.appendChild(thead);
    const tbody = document.createElement('tbody');

    function td(content, opts){
      opts = opts || {};
      const cell = document.createElement('td');
      if(opts.num) cell.className = 'num';
      if(opts.style) cell.style.cssText = opts.style;
      if(opts.title) cell.title = opts.title;
      if(content instanceof Node) cell.appendChild(content);
      else cell.textContent = content;
      return cell;
    }

    const footRefs = {};
    const rowUpdaters = {};

    function refreshFooter(){
      const s2 = draftSummary();
      footRefs.premium.textContent = INR(s2.totalPremium);
      footRefs.prevBalance.textContent = INR(s2.totalPrevBalance);
      footRefs.interest.textContent = INR(s2.totalInterest);
      footRefs.refund.textContent = INR(s2.totalRefund);
      footRefs.newLoan.textContent = INR(s2.totalNewLoans);
      footRefs.collected.textContent = INR(s2.totalCollected);
      footRefs.outstanding.textContent = INR(s2.totalOutstanding);
    }

    state.members.filter(m=> isCurrent ? (m.active || safe((viewEntries[m.id]||{}).exitPayout)) : !!viewEntries[m.id]).forEach((m, i)=>{
      let e = viewEntries[m.id];
      if(!e) return;
      const tr = document.createElement('tr');
      tr.appendChild(td(String(i+1), {num:true}));

      const nameCell = document.createElement('td');
      nameCell.style.textAlign = 'left';
      const paidDot = (isCurrent && m.active)
        ? `<span title="${e.paid ? 'Paid this month' : 'Payment pending'}" style="display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; background:${e.paid ? 'var(--teal)' : 'var(--clay)'};"></span>`
        : '';
      if(isEditing){
        nameCell.innerHTML = `${paidDot}<span style="color:var(--ink); font-weight:600;">${m.name}</span> <span style="color:var(--muted); font-size:12px;">✎</span>`;
      } else {
        nameCell.innerHTML = `${paidDot}<span>${m.name}</span>`;
      }
      tr.appendChild(nameCell);

      tr.appendChild(td(INR(entryPremium(e)), {num:true}));
      tr.appendChild(td(INR(e.previousLoanBalance), {num:true, style: e.carried ? 'color:var(--muted);' : '', title: e.carried ? 'Carried forward' : ''}));

      const interestTd = td(INR(e.interest), {num:true});
      tr.appendChild(interestTd);

      tr.appendChild(td(INR(e.loanRefund), {num:true}));
      tr.appendChild(td(INR(e.newLoanIssued), {num:true}));

      const collectedTd = td(INR(e.totalCollected), {num:true, style:'font-weight:600;'});
      tr.appendChild(collectedTd);

      const dividendEligibleRow = m.active && !!e.carried;
      const dividendForMember = dividendEligibleRow ? rupee(l.dividendPerMember || 0) : 0;
      const dividendAppliedForMember = dividendEligibleRow ? dividendAppliedToLoan(e.finalLoanBalance, l.dividendPerMember) : 0;
      const dividendTd = td(INR(dividendForMember), {num:true, style:'color:var(--muted);'});
      tr.appendChild(dividendTd);

      const adjustedFinal = rupee(e.finalLoanBalance - dividendAppliedForMember);
      const finalTd = td(INR(adjustedFinal), {num:true, style:`font-weight:600; color:${adjustedFinal>0?'var(--clay)':'var(--ink)'};`});
      tr.appendChild(finalTd);

      tr.appendChild(td(e.remark || '-', {style:'font-style:italic; color:var(--muted); text-align:left; max-width:110px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;'}));

      if(isEditing){
        tr.style.cursor = 'pointer';
        tr.onclick = ()=>{ pendingLedgerRowEdit = { monthKey: viewKey, memberId: m.id }; render(); };
      }

      tbody.appendChild(tr);

      // Only used to live-patch computed cells when the interest rate changes below —
      // per-member figures are now edited through the tap-to-edit modal instead.
      rowUpdaters[m.id] = (newEntry)=>{
        e = newEntry;
        interestTd.textContent = INR(e.interest);
        collectedTd.textContent = INR(e.totalCollected);
        const dividendFlat = dividendEligibleRow ? rupee(l.dividendPerMember || 0) : 0;
        dividendTd.textContent = INR(dividendFlat);
        const dividendAppliedNow = dividendEligibleRow ? dividendAppliedToLoan(e.finalLoanBalance, l.dividendPerMember) : 0;
        const adjustedFinalNow = rupee(e.finalLoanBalance - dividendAppliedNow);
        finalTd.textContent = INR(adjustedFinalNow);
        finalTd.style.color = adjustedFinalNow > 0 ? 'var(--clay)' : 'var(--ink)';
        refreshFooter();
      };
    });
    table.appendChild(tbody);

    const s = draftSummary();
    const tfoot = document.createElement('tfoot');
    const footTr = document.createElement('tr');
    footTr.appendChild(td(''));
    footTr.appendChild(td('Total'));
    footRefs.premium = td(INR(s.totalPremium), {num:true}); footTr.appendChild(footRefs.premium);
    footRefs.prevBalance = td(INR(s.totalPrevBalance), {num:true}); footTr.appendChild(footRefs.prevBalance);
    footRefs.interest = td(INR(s.totalInterest), {num:true}); footTr.appendChild(footRefs.interest);
    footRefs.refund = td(INR(s.totalRefund), {num:true}); footTr.appendChild(footRefs.refund);
    footRefs.newLoan = td(INR(s.totalNewLoans), {num:true}); footTr.appendChild(footRefs.newLoan);
    footRefs.collected = td(INR(s.totalCollected), {num:true}); footTr.appendChild(footRefs.collected);
    footTr.appendChild(td(INR(s.totalDividend), {num:true}));
    footRefs.outstanding = td(INR(s.totalOutstanding), {num:true}); footTr.appendChild(footRefs.outstanding);
    footTr.appendChild(td(''));
    tfoot.appendChild(footTr);
    table.appendChild(tfoot);
    wrap.appendChild(table);
    body.appendChild(wrap);

    if(isEditing && pendingLedgerRowEdit && pendingLedgerRowEdit.monthKey === viewKey){
      const editMember = state.members.find(mm => mm.id === pendingLedgerRowEdit.memberId);
      const editEntry = editMember ? viewEntries[editMember.id] : null;
      if(!editMember || !editEntry){
        pendingLedgerRowEdit = null;
      } else {
        const rate = isDraftEditing ? ledgerEdit.rate : state.interestRate;
        // Only the current open month should track live premium edits from the
        // Members tab — a closed month must keep showing what was actually
        // collected at the time, derived from its own stored entry.
        const modalPremium = isCurrent ? editMember.premium : entryPremium(editEntry);
        let draft = { ...editEntry, amountPaid: editEntry.totalCollected };

        const overlay = document.createElement('div');
        overlay.className = 'modal-overlay';
        const box = document.createElement('div');
        box.className = 'modal-box';

        const heading = document.createElement('h2');
        heading.textContent = editMember.name;
        box.appendChild(heading);

        const sub = document.createElement('p');
        sub.style.cssText = 'font-size:12px; color:var(--muted); margin:-8px 0 14px;';
        sub.textContent = `Premium ${INR(modalPremium)} · ${monthLabel(viewKey)}`;
        box.appendChild(sub);

        function field(labelText, key, opts){
          opts = opts || {};
          const wrap2 = document.createElement('div');
          wrap2.style.marginBottom = '10px';
          const lab = document.createElement('label');
          lab.textContent = labelText;
          lab.style.cssText = 'display:block; font-size:11px; color:var(--muted); font-weight:600; margin-bottom:3px;';
          wrap2.appendChild(lab);
          const inp = document.createElement('input');
          inp.type = opts.text ? 'text' : 'number';
          inp.value = draft[key];
          if(opts.disabled){
            inp.disabled = true;
            inp.style.opacity = '0.6';
          } else {
            inp.oninput = (ev)=>{
              draft[key] = ev.target.value;
              refreshPreview();
            };
          }
          wrap2.appendChild(inp);
          if(opts.note){
            const note = document.createElement('p');
            note.style.cssText = 'font-size:11px; color:var(--muted); margin:3px 0 0;';
            note.textContent = opts.note;
            wrap2.appendChild(note);
          }
          box.appendChild(wrap2);
          return inp;
        }

        // Loan refund is no longer entered directly — the admin enters the actual
        // cash amount paid, and refund is derived as whatever's left after covering
        // premium + interest (computeDraftEntry below does this split).
        field('Previous balance', 'previousLoanBalance', editEntry.carried ? {disabled:true, note:'Carried forward from last month — not editable here.'} : {});
        field('Amount paid', 'amountPaid', {note:'Total cash collected from this member this month.'});
        field('New loan issued', 'newLoanIssued');
        const remarkInp = field('Remarks', 'remark', {text:true});
        remarkInp.placeholder = 'Add notes…';

        let draftPaid = !!editEntry.paid;
        const paidWrap = document.createElement('label');
        paidWrap.style.cssText = 'display:flex; align-items:center; gap:8px; margin:4px 0 14px; padding:10px 12px; border-radius:var(--radius-md); background:var(--teal-light); cursor:pointer;';
        const paidCheckbox = document.createElement('input');
        paidCheckbox.type = 'checkbox';
        paidCheckbox.checked = draftPaid;
        paidCheckbox.style.cssText = 'width:18px; height:18px; accent-color:var(--teal); cursor:pointer;';
        paidCheckbox.oninput = (ev)=>{ draftPaid = ev.target.checked; };
        paidWrap.appendChild(paidCheckbox);
        const paidLabelText = document.createElement('span');
        paidLabelText.style.cssText = 'font-size:13px; font-weight:600; color:var(--ink);';
        paidLabelText.textContent = 'Payment received for this month';
        paidWrap.appendChild(paidLabelText);
        box.appendChild(paidWrap);

        const preview = document.createElement('div');
        preview.style.cssText = 'background:var(--paper); border-radius:var(--radius-md); padding:10px 12px; margin:6px 0 14px; font-size:12.5px; color:var(--muted); display:flex; flex-direction:column; gap:3px;';
        box.appendChild(preview);

        function computeDraftEntry(){
          const interestNow = rupee(safe(draft.previousLoanBalance) * rate / 100);
          const derivedLoanRefund = rupee(safe(draft.amountPaid) - modalPremium - interestNow);
          const computed = computeEntry(draft.previousLoanBalance, modalPremium, rate, derivedLoanRefund, draft.newLoanIssued, !!editEntry.carried, draft.remark);
          computed.paid = draftPaid;
          return computed;
        }

        function refreshPreview(){
          const computed = computeDraftEntry();
          preview.innerHTML = `
            <div style="display:flex; justify-content:space-between;"><span>Interest</span><span class="num">${INR(computed.interest)}</span></div>
            <div style="display:flex; justify-content:space-between;"><span>Loan refund (derived)</span><span class="num">${INR(computed.loanRefund)}</span></div>
            <div style="display:flex; justify-content:space-between;"><span>Total collected</span><span class="num" style="font-weight:600; color:var(--ink);">${INR(computed.totalCollected)}</span></div>
            <div style="display:flex; justify-content:space-between;"><span>Final balance</span><span class="num" style="font-weight:600; color:${computed.finalLoanBalance>0?'var(--clay)':'var(--ink)'};">${INR(computed.finalLoanBalance)}</span></div>
          `;
        }
        refreshPreview();

        const btnRow = document.createElement('div');
        btnRow.className = 'row-btns';
        const saveBtn = document.createElement('button');
        saveBtn.className = 'primary';
        saveBtn.textContent = 'Save';
        saveBtn.onclick = ()=>{
          const computed = computeDraftEntry();
          if(isDraftEditing){
            ledgerEdit.entries[editMember.id] = computed;
          } else {
            l.entries[editMember.id] = computed;
            l.touched = true;
            recomputeForward(viewKey);
            persistFromMonth(viewKey);
          }
          pendingLedgerRowEdit = null;
          render();
        };
        btnRow.appendChild(saveBtn);

        const cancelBtn = document.createElement('button');
        cancelBtn.className = 'secondary';
        cancelBtn.textContent = 'Cancel';
        cancelBtn.onclick = ()=>{ pendingLedgerRowEdit = null; render(); };
        btnRow.appendChild(cancelBtn);

        box.appendChild(btnRow);
        overlay.appendChild(box);
        body.appendChild(overlay);
      }
    }

    if(isCurrent){
      const rateRow = document.createElement('div');
      rateRow.style.cssText = 'margin-top:16px; display:flex; align-items:center; gap:8px;';
      rateRow.innerHTML = `<label style="font-size:12px; color:var(--muted); font-style:italic;">Monthly interest rate (%)</label>`;
      const rateInp = document.createElement('input'); rateInp.type='number'; rateInp.step='0.1';
      rateInp.value = isDraftEditing ? ledgerEdit.rate : state.interestRate;
      rateInp.style.width='60px';
      rateInp.disabled = !window.isAdmin;
      rateInp.oninput = (e)=>{
        const newRate = parseFloat(e.target.value)||0;
        if(isDraftEditing){
          ledgerEdit.rate = newRate;
          state.members.forEach(m=>{
            const e2 = ledgerEdit.entries[m.id];
            if(!e2) return;
            const updated = computeEntry(e2.previousLoanBalance, m.premium, newRate, e2.loanRefund, e2.newLoanIssued, e2.carried, e2.remark);
            if(rowUpdaters[m.id]) rowUpdaters[m.id](updated);
            else ledgerEdit.entries[m.id] = updated;
          });
        } else {
          state.interestRate = newRate;
          state.members.forEach(m=>{
            const e2 = l.entries[m.id];
            if(!e2) return;
            const updated = computeEntry(e2.previousLoanBalance, m.premium, newRate, e2.loanRefund, e2.newLoanIssued, e2.carried, e2.remark);
            if(rowUpdaters[m.id]) rowUpdaters[m.id](updated);
            else l.entries[m.id] = updated;
          });
          l.touched = true;
          recomputeForward(viewKey); refreshFooter();
          persistAll(); persistFromMonth(viewKey);
        }
      };
      rateRow.appendChild(rateInp);
      body.appendChild(rateRow);
    }

    const bottomPanel = document.createElement('div');
    bottomPanel.className = 'ledger-bottom-panel';

    const prevBtn = document.createElement('button');
    prevBtn.className = 'ledger-icon-btn';
    prevBtn.innerHTML = MONO_ICONS.prev;
    prevBtn.title = 'Previous Month';
    prevBtn.disabled = !prevKey;
    if(!prevKey){ prevBtn.style.opacity = '0.35'; prevBtn.style.cursor = 'not-allowed'; }
    prevBtn.onclick = ()=>{ if(prevKey){ state.viewingMonth = prevKey; renderLedger(body); } };
    bottomPanel.appendChild(prevBtn);

    const centerGroup = document.createElement('div');
    centerGroup.style.cssText = 'display:flex; gap:6px; align-items:center;';

    if(!isCurrent){
      const jumpBtn = document.createElement('button');
      jumpBtn.className = 'ledger-icon-btn';
      jumpBtn.innerHTML = MONO_ICONS.today;
      jumpBtn.title = 'Jump to Current Month';
      jumpBtn.onclick = ()=>{ state.viewingMonth = state.currentMonth; renderLedger(body); };
      centerGroup.appendChild(jumpBtn);
    }

    if(window.isAdmin && isCurrent){
      const closeBtn = document.createElement('button');
      closeBtn.className = 'ledger-icon-btn primary';
      const pendingForClose = pendingPaymentCount();
      const canClose = l.touched && pendingForClose === 0;
      closeBtn.innerHTML = `${MONO_ICONS.close} Close`;
      closeBtn.title = pendingForClose > 0
        ? `${pendingForClose} member${pendingForClose===1?'':'s'} still ${pendingForClose===1?'hasn\'t':'haven\'t'} paid this month — confirm payment on their row before closing.`
        : 'Close Month & Start Next';
      if(!canClose){
        closeBtn.disabled = true;
        closeBtn.style.opacity = '0.45';
        closeBtn.style.cursor = 'not-allowed';
      }
      let armed = false;
      closeBtn.onclick = async ()=>{
        if(!canClose) return;
        if(!armed){
          armed = true;
          closeBtn.innerHTML = `${MONO_ICONS.alert} Confirm`;
          closeBtn.style.background = 'var(--clay)';
          setTimeout(()=>{
            if(armed){ armed=false; closeBtn.innerHTML=`${MONO_ICONS.close} Close`; closeBtn.style.background='var(--teal)'; }
          }, 4000);
          return;
        }
        l.closed = true;
        // Auto-clear any pending loan request for a member who received a new loan in
        // the month that just closed — the request has now been fulfilled. Deliberately
        // happens at CLOSE time, not the moment the loan figure is entered, since the
        // open month's entries can still be edited/corrected right up until close.
        const fulfilledMemberIds = new Set(
          Object.keys(l.entries).filter(mid => safe(l.entries[mid].newLoanIssued) > 0)
        );
        if(fulfilledMemberIds.size && state.loanRequests.length){
          const before = state.loanRequests.length;
          state.loanRequests = state.loanRequests.filter(r => !fulfilledMemberIds.has(r.memberId));
          if(state.loanRequests.length !== before){ await persistLoanRequests(); }
        }
        await persistLedger(state.currentMonth);
        state.months.push(state.currentMonth);
        state.currentMonth = nextMonthKey(state.currentMonth);
        await persistAll();
        ensureCurrentMonthLedger();
        await persistLedger(state.currentMonth);
        state.viewingMonth = state.currentMonth;
        render();
      };
      centerGroup.appendChild(closeBtn);
    }

    if(window.isAdmin && !isCurrent){
      if(!isDraftEditing){
        const editBtn = document.createElement('button');
        editBtn.className = 'ledger-icon-btn primary';
        editBtn.innerHTML = MONO_ICONS.edit;
        editBtn.title = 'Edit Ledger';
        editBtn.onclick = ()=>{
          ledgerEdit.month = viewKey;
          ledgerEdit.entries = {};
          state.members.forEach(m=>{ if(l.entries[m.id]) ledgerEdit.entries[m.id] = {...l.entries[m.id]}; });
          ledgerEdit.rate = state.interestRate;
          renderLedger(body);
        };
        centerGroup.appendChild(editBtn);
      } else {
        const saveBtn = document.createElement('button');
        saveBtn.className = 'ledger-icon-btn primary';
        saveBtn.innerHTML = MONO_ICONS.save;
        saveBtn.title = 'Save Changes';
        saveBtn.onclick = async ()=>{
          Object.keys(ledgerEdit.entries).forEach(id=>{ l.entries[id] = ledgerEdit.entries[id]; });
          l.touched = true;
          recomputeForward(viewKey);
          ledgerEdit = { month:null, entries:null, rate:null };
          await persistAll();
          await persistFromMonth(viewKey);
          renderLedger(body);
        };
        centerGroup.appendChild(saveBtn);

        const cancelBtn = document.createElement('button');
        cancelBtn.className = 'ledger-icon-btn';
        cancelBtn.innerHTML = MONO_ICONS.cancel;
        cancelBtn.title = 'Cancel Editing';
        cancelBtn.onclick = ()=>{
          ledgerEdit = { month:null, entries:null, rate:null };
          renderLedger(body);
        };
        centerGroup.appendChild(cancelBtn);
      }
    }

    if(l.closed){
      const exportBtn = document.createElement('button');
      exportBtn.className = 'ledger-icon-btn';
      exportBtn.innerHTML = MONO_ICONS.pdf;
      exportBtn.title = 'Export PDF';
      exportBtn.onclick = ()=> openPdfExportOptions(viewKey);
      centerGroup.appendChild(exportBtn);
    }

    if(window.isAdmin && !isCurrent && !isEditing){
      const deleteBtn = document.createElement('button');
      deleteBtn.className = 'ledger-icon-btn';
      deleteBtn.style.color = 'var(--clay)';
      deleteBtn.style.borderColor = 'var(--clay)';
      deleteBtn.innerHTML = MONO_ICONS.delete;
      deleteBtn.title = 'Delete Month';
      let armed = false;
      deleteBtn.onclick = async ()=>{
        if(!armed){
          armed = true;
          deleteBtn.innerHTML = MONO_ICONS.alert;
          deleteBtn.style.background = 'var(--clay)';
          deleteBtn.style.color = '#fff';
          setTimeout(()=>{
            if(armed){ armed=false; deleteBtn.innerHTML = MONO_ICONS.delete; deleteBtn.style.background=''; deleteBtn.style.color='var(--clay)'; }
          }, 4000);
          return;
        }
        await deleteMonth(viewKey);
        state.viewingMonth = state.currentMonth;
        render();
      };
      centerGroup.appendChild(deleteBtn);
    }

    bottomPanel.appendChild(centerGroup);

    const nextBtn = document.createElement('button');
    nextBtn.className = 'ledger-icon-btn';
    nextBtn.innerHTML = MONO_ICONS.next;
    nextBtn.title = 'Next Month';
    nextBtn.disabled = !nextKey;
    if(!nextKey){ nextBtn.style.opacity = '0.35'; nextBtn.style.cursor = 'not-allowed'; }
    nextBtn.onclick = ()=>{ if(nextKey){ state.viewingMonth = nextKey; renderLedger(body); } };
    bottomPanel.appendChild(nextBtn);

    body.appendChild(bottomPanel);
  }

  function renderLoanRequests(body){
    const activeMembers = state.members.filter(m => m.active);
    const loggedInMember = findLoggedInLiveMember();

    const head = document.createElement('div');
    head.style.cssText = 'display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem; flex-wrap:wrap; gap:8px;';
    head.innerHTML = `<h3 style="font-size:17px; font-weight:800; margin:0; color:var(--ink);">Loan Requests</h3>
      <span style="color:var(--muted); font-size:12.5px; font-weight:600;">${state.loanRequests.length} pending</span>`;
    body.appendChild(head);

    // --- Request form: any logged-in member can request for themselves; admin can
    // log a request on behalf of any active member (e.g. if asked verbally). ---
    const formBox = document.createElement('div');
    formBox.style.cssText = 'background:var(--paper-2); backdrop-filter:var(--glass-filter); -webkit-backdrop-filter:var(--glass-filter); border:1px solid var(--rule); border-radius:var(--radius-lg); padding:16px; margin-bottom:16px; box-shadow:var(--shadow-sm);';

    const formTitle = document.createElement('p');
    formTitle.style.cssText = 'font-size:13px; font-weight:700; color:var(--ink); margin:0 0 10px;';
    formTitle.textContent = 'Request a loan';
    formBox.appendChild(formTitle);

    let selectedMemberId = null;
    let memberSelect = null;
    if(window.isAdmin){
      const lab = document.createElement('label');
      lab.style.cssText = 'display:block; font-size:11px; color:var(--muted); font-weight:600; margin-bottom:4px;';
      lab.textContent = 'Member';
      formBox.appendChild(lab);
      memberSelect = document.createElement('select');
      memberSelect.style.cssText = 'width:100%; margin-bottom:10px; padding:9px 10px; border-radius:var(--radius-sm); border:1.5px solid var(--rule-strong); background:var(--input-bg); color:var(--ink); font-family:inherit; font-size:14px;';
      activeMembers.forEach(m=>{
        const opt = document.createElement('option');
        opt.value = m.id; opt.textContent = m.name;
        memberSelect.appendChild(opt);
      });
      formBox.appendChild(memberSelect);
      selectedMemberId = activeMembers[0] ? activeMembers[0].id : null;
      memberSelect.onchange = ()=>{ selectedMemberId = memberSelect.value; };
    } else if(loggedInMember){
      selectedMemberId = loggedInMember.id;
      const asLabel = document.createElement('p');
      asLabel.style.cssText = 'font-size:12.5px; color:var(--muted); margin:0 0 10px;';
      asLabel.textContent = `Requesting as ${loggedInMember.name}`;
      formBox.appendChild(asLabel);
    }

    if(!window.isAdmin && !loggedInMember){
      const noMatch = document.createElement('p');
      noMatch.style.cssText = 'font-size:12.5px; color:var(--clay); margin:0;';
      noMatch.textContent = "We couldn't match your login to a member record, so a request can't be submitted from here.";
      formBox.appendChild(noMatch);
    } else {
      const amountInp = document.createElement('input');
      amountInp.type = 'number';
      amountInp.placeholder = 'Amount requested';
      amountInp.style.cssText = 'width:100%; margin-bottom:10px; padding:9px 10px; border-radius:var(--radius-sm); border:1.5px solid var(--rule-strong); background:var(--input-bg); color:var(--ink); font-family:inherit; font-size:14px;';
      formBox.appendChild(amountInp);

      const remarkInp = document.createElement('input');
      remarkInp.type = 'text';
      remarkInp.placeholder = 'Reason (optional)';
      remarkInp.style.cssText = 'width:100%; margin-bottom:12px; padding:9px 10px; border-radius:var(--radius-sm); border:1.5px solid var(--rule-strong); background:var(--input-bg); color:var(--ink); font-family:inherit; font-size:14px;';
      formBox.appendChild(remarkInp);

      const msgP = document.createElement('p');
      msgP.style.cssText = 'font-size:12.5px; margin:0 0 8px; color:var(--clay); display:none;';
      formBox.appendChild(msgP);

      const submitBtn = document.createElement('button');
      submitBtn.className = 'primary';
      submitBtn.textContent = 'Submit request';
      submitBtn.onclick = async ()=>{
        const amt = rupee(amountInp.value);
        if(!selectedMemberId){ msgP.style.display='block'; msgP.textContent='Select a member.'; return; }
        if(amt <= 0){ msgP.style.display='block'; msgP.textContent='Enter a valid amount.'; return; }
        const mem = state.members.find(x=>x.id===selectedMemberId);
        const newRequest = {
          id: uid(),
          memberId: selectedMemberId,
          memberName: mem ? mem.name : '',
          amount: amt,
          remark: remarkInp.value.trim(),
          requestedMonth: state.currentMonth,
          createdAt: new Date().toISOString(),
        };
        state.loanRequests.push(newRequest);
        submitBtn.disabled = true;
        try{
          await persistLoanRequests();
          await appendLoanRequestLog('created', newRequest);
          render();
        } catch(err){
          // Roll back the in-memory add — otherwise the request would keep showing on
          // THIS device for the rest of the session even though it was never actually
          // saved, then vanish (looking like it "deleted itself") the next time the
          // app reloads fresh data from Firestore.
          state.loanRequests = state.loanRequests.filter(r => r.id !== newRequest.id);
          submitBtn.disabled = false;
          msgP.style.display = 'block';
          msgP.textContent = "Couldn't save your request — you may not have permission to do this. Please tell the admin.";
          console.error('persistLoanRequests failed:', err);
        }
      };
      formBox.appendChild(submitBtn);
    }

    body.appendChild(formBox);

    // --- The shared log: visible to every logged-in user, admin or member. ---
    if(state.loanRequests.length === 0){
      const empty = document.createElement('p');
      empty.style.cssText = 'text-align:center; color:var(--muted); padding:2rem 1rem; font-style:italic;';
      empty.textContent = 'No pending loan requests.';
      body.appendChild(empty);
    } else {
      const sorted = [...state.loanRequests].sort((a,b)=> (b.createdAt||'').localeCompare(a.createdAt||''));
      sorted.forEach(req=>{
        const reqCard = document.createElement('div');
        reqCard.style.cssText = 'background:var(--paper-2); backdrop-filter:var(--glass-filter); -webkit-backdrop-filter:var(--glass-filter); border:1px solid var(--rule); border-radius:var(--radius-lg); padding:14px 16px; margin-bottom:10px; box-shadow:var(--shadow-sm);';

        const top = document.createElement('div');
        top.style.cssText = 'display:flex; justify-content:space-between; align-items:baseline; gap:8px;';
        top.innerHTML = `<span style="font-weight:700; color:var(--ink); font-size:14px;">${req.memberName}</span>
          <span class="num" style="font-weight:800; color:var(--teal); font-size:15px;">${INR(req.amount)}</span>`;
        reqCard.appendChild(top);

        const metaP = document.createElement('p');
        metaP.style.cssText = 'font-size:11.5px; color:var(--muted); margin:4px 0 0;';
        metaP.textContent = `Requested ${monthLabel(req.requestedMonth)}${req.remark ? ' \u00B7 ' + req.remark : ''}`;
        reqCard.appendChild(metaP);

        const canCancel = window.isAdmin || (loggedInMember && loggedInMember.id === req.memberId);
        if(canCancel){
          const cancelBtn = document.createElement('button');
          cancelBtn.className = 'ghost';
          cancelBtn.style.cssText = 'margin-top:8px; color:var(--clay); padding:4px 8px; font-size:12px;';
          cancelBtn.textContent = window.isAdmin ? 'Remove' : 'Cancel request';
          cancelBtn.onclick = async ()=>{
            const previous = state.loanRequests;
            const removedReq = req;
            state.loanRequests = state.loanRequests.filter(r=>r.id !== req.id);
            try{
              await persistLoanRequests();
              await appendLoanRequestLog('cancelled', removedReq);
              render();
            } catch(err){
              state.loanRequests = previous;
              alert("Couldn't remove this request — you may not have permission to do this.");
              console.error('persistLoanRequests failed:', err);
            }
          };
          reqCard.appendChild(cancelBtn);
        }

        body.appendChild(reqCard);
      });
    }

    // --- Activity log: who created or cancelled what, and when. Visible to everyone,
    // specifically so that if a member cancels someone ELSE's request — which the
    // Firestore rules technically permit, since loan requests are a single shared
    // document — it doesn't happen invisibly. ---
    if(state.loanRequestLog.length > 0){
      const logHeading = document.createElement('p');
      logHeading.style.cssText = 'font-size:11px; letter-spacing:.02em; color:var(--muted); margin:20px 0 8px; font-weight:600; text-transform:uppercase;';
      logHeading.textContent = 'Activity log';
      body.appendChild(logHeading);

      const sortedLog = [...state.loanRequestLog].sort((a,b)=> (b.timestamp||'').localeCompare(a.timestamp||''));
      sortedLog.forEach(entry=>{
        const row = document.createElement('div');
        row.style.cssText = 'padding:8px 4px; border-bottom:1px solid var(--rule); font-size:12.5px; color:var(--ink);';
        const when = entry.timestamp ? new Date(entry.timestamp).toLocaleString('en-IN', { day:'numeric', month:'short', year:'numeric', hour:'numeric', minute:'2-digit' }) : '';
        const verb = entry.action === 'cancelled' ? 'cancelled' : 'requested';
        row.innerHTML = `<span style="font-weight:600;">${entry.byName}</span> ${verb} <span class="num" style="font-weight:700;">${INR(entry.amount)}</span> for <span style="font-weight:600;">${entry.memberName}</span>
          <br><span style="color:var(--muted); font-size:11px;">${when}</span>`;
        body.appendChild(row);
      });
    }
  }

  function renderMembers(body){
    body.innerHTML = '';
    const activeMemberCount = state.members.filter(m => m.active).length;
    const h = document.createElement('div');
    h.style.cssText = 'display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem; flex-wrap:wrap; gap:8px;';
    h.innerHTML = `<h3 style="font-size:17px; font-weight:800; margin:0; color:var(--ink);">Members</h3>
      <span style="color:var(--muted); font-size:12.5px; font-weight:600;">${activeMemberCount} active</span>`;
    body.appendChild(h);

    ensureCurrentMonthLedger();
    const currentNav = rupee((summary(state.currentMonth) || {nav:0}).nav);

    if(window.isAdmin && pendingMemberAdd){
      const creatingAccount = !!pendingMemberAdd.email;
      const panel = document.createElement('div');
      panel.style.cssText = 'display:flex; flex-direction:column; gap:10px; margin-bottom:20px; padding:14px 16px; border:1px solid var(--rule-strong); border-radius:6px; background:var(--paper-2); backdrop-filter:var(--glass-filter); -webkit-backdrop-filter:var(--glass-filter);';
      const msg = document.createElement('p');
      msg.style.cssText = 'margin:0; font-size:14px; color:var(--ink);';
      msg.innerHTML = creatingAccount
        ? `Adding <strong>${pendingMemberAdd.name}</strong> (${pendingMemberAdd.email}) — current NAV is <strong>${INR(currentNav)}</strong>. Choose how they are joining:`
        : `Adding <strong>${pendingMemberAdd.name}</strong> — current NAV is <strong>${INR(currentNav)}</strong>. How are they joining?`;
      panel.appendChild(msg);

      const statusMsg = document.createElement('p');
      statusMsg.style.cssText = 'margin:0; font-size:13px; display:none;';
      panel.appendChild(statusMsg);

      const btnRow = document.createElement('div');
      btnRow.style.cssText = 'display:flex; gap:8px; flex-wrap:wrap;';

      async function finalizeJoin(addLedgerEntry){
        btnRow.querySelectorAll('button').forEach(b => b.disabled = true);
        if(creatingAccount){
          statusMsg.textContent = 'Creating account…';
          statusMsg.style.color = 'var(--muted)';
          statusMsg.style.display = 'block';
          let result;
          try{
            result = await nativeCreateAccount(pendingMemberAdd.name, pendingMemberAdd.email, pendingMemberAdd.password);
          }catch(e){
            result = { error: (e && e.message) || "Couldn't create account." };
          }
          if(!result || result.error){
            statusMsg.textContent = (result && result.error) || "Couldn't create account.";
            statusMsg.style.color = 'var(--clay)';
            btnRow.querySelectorAll('button').forEach(b => b.disabled = false);
            return;
          }
        }
        addLedgerEntry();
        pendingMemberAdd = null;
        await persistAll(); await persistLedger(state.currentMonth);
        render();
      }

      const payBtn = document.createElement('button');
      payBtn.className = 'primary';
      payBtn.textContent = `Join by paying NAV (${INR(currentNav)} cash)`;
      payBtn.onclick = ()=> finalizeJoin(()=>{
        const m = {id:uid(), name:pendingMemberAdd.name, premium:pendingMemberAdd.premium, active:true, addedInApp:true};
        state.members.push(m);
        ensureCurrentMonthLedger();
        const l = state.ledgers[state.currentMonth];
        // The NAV payment is real cash collected this month, so it belongs in this
        // entry's own collected total (visible in the Premium/Total collected
        // columns) — never in openingCash, which is a locked figure carried
        // forward from the last closed month and must stay untouched.
        l.entries[m.id] = computeEntry(0, rupee(m.premium) + currentNav, state.interestRate, 0, 0, false,
          `Joined this month — paid NAV of ${INR(currentNav)} in cash`);
        l.entries[m.id].navCashInjection = currentNav;
        l.entries[m.id].paid = true; // cash was collected right here as part of joining
        l.touched = true;
      });
      btnRow.appendChild(payBtn);

      const loanBtn = document.createElement('button');
      loanBtn.textContent = `Join by making NAV loan balance (${INR(currentNav)} owed)`;
      loanBtn.onclick = ()=> finalizeJoin(()=>{
        const m = {id:uid(), name:pendingMemberAdd.name, premium:pendingMemberAdd.premium, active:true, addedInApp:true};
        state.members.push(m);
        ensureCurrentMonthLedger();
        const l = state.ledgers[state.currentMonth];
        // currentNav is a brand-new loan issued to the incoming member, not a
        // pre-existing balance they arrived with — it must be passed as newLoan,
        // not prevBalance (previously this args were swapped, which posted it to
        // the Previous balance column and wrongly charged interest on it).
        l.entries[m.id] = computeEntry(0, m.premium, state.interestRate, 0, currentNav, false,
          `Joined this month — NAV loan balance of ${INR(currentNav)}`);
        l.entries[m.id].paid = false; // no cash collected — this month's premium is still pending
        l.touched = true;
      });
      btnRow.appendChild(loanBtn);

      const cancelBtn = document.createElement('button');
      cancelBtn.className = 'ghost';
      cancelBtn.textContent = 'Cancel';
      cancelBtn.onclick = ()=>{ pendingMemberAdd = null; render(); };
      btnRow.appendChild(cancelBtn);

      panel.appendChild(btnRow);
      body.appendChild(panel);
    }

    if(window.isAdmin && pendingMemberExit){
      const m = state.members.find(x => x.id === pendingMemberExit);
      if(!m){
        pendingMemberExit = null;
      } else {
        const ex = computeExitPayout(m.id);
        const panel = document.createElement('div');
        panel.style.cssText = 'display:flex; flex-direction:column; gap:10px; margin-bottom:20px; padding:14px 16px; border:1px solid var(--rule-strong); border-radius:6px; background:var(--paper-2); backdrop-filter:var(--glass-filter); -webkit-backdrop-filter:var(--glass-filter);';

        const msg = document.createElement('div');
        msg.style.cssText = 'font-size:14px; color:var(--ink);';
        msg.innerHTML = `<p style="margin:0 0 8px;">Exiting <strong>${m.name}</strong> — payout is based on the last closed month's NAV, adjusted for their own activity since then:</p>
          <table style="width:100%; font-size:13px; border-collapse:collapse;">
            <tr><td style="padding:3px 0;">NAV basis (${ex.basisIsClosedMonth ? monthLabel(ex.basisMonthKey) : "current month — no closed month yet"})</td><td class="num" style="text-align:right;">${INR(ex.basisNav)}</td></tr>
            <tr><td style="padding:3px 0;">+ Premium paid this month</td><td class="num" style="text-align:right;">${INR(ex.premiumThisMonth)}</td></tr>
            <tr><td style="padding:3px 0;">− Outstanding loan balance</td><td class="num" style="text-align:right;">${INR(ex.outstandingNow)}</td></tr>
            <tr style="border-top:1.5px solid var(--rule-strong); font-weight:800;"><td style="padding:5px 0;">Exit payout</td><td class="num" style="text-align:right; padding:5px 0; color:${ex.payout >= 0 ? 'var(--teal)' : 'var(--clay)'};">${INR(ex.payout)}</td></tr>
          </table>`;
        panel.appendChild(msg);

        if(ex.payout < 0){
          const warn = document.createElement('p');
          warn.style.cssText = 'margin:0; font-size:13px; color:var(--clay); font-weight:600;';
          warn.textContent = `${m.name} still owes more than their payout covers — settle the difference with them directly before exiting, this can't be processed automatically.`;
          panel.appendChild(warn);
        }

        const btnRow2 = document.createElement('div');
        btnRow2.style.cssText = 'display:flex; gap:8px; flex-wrap:wrap;';

        const confirmBtn = document.createElement('button');
        confirmBtn.className = 'primary';
        confirmBtn.textContent = `Confirm exit — pay out ${INR(ex.payout)}`;
        confirmBtn.disabled = ex.payout < 0;
        confirmBtn.onclick = async ()=>{
          ensureCurrentMonthLedger();
          const l = state.ledgers[state.currentMonth];
          const e = l.entries[m.id];
          e.exitPayout = ex.payout;
          e.finalLoanBalance = 0;
          e.remark = `Exited fund — paid out ${INR(ex.payout)} (basis NAV ${INR(ex.basisNav)} from ${ex.basisIsClosedMonth ? monthLabel(ex.basisMonthKey) : 'this month'}, + premium ${INR(ex.premiumThisMonth)}, − loan ${INR(ex.outstandingNow)})`;
          l.touched = true;
          m.active = false;
          pendingMemberExit = null;
          await persistAll(); await persistLedger(state.currentMonth);
          render();
        };
        btnRow2.appendChild(confirmBtn);

        const cancelBtn2 = document.createElement('button');
        cancelBtn2.className = 'ghost';
        cancelBtn2.textContent = 'Cancel';
        cancelBtn2.onclick = ()=>{ pendingMemberExit = null; render(); };
        btnRow2.appendChild(cancelBtn2);

        panel.appendChild(btnRow2);
        body.appendChild(panel);
      }
    }

    const wrap = document.createElement('div');
    wrap.style.cssText = 'overflow-x:auto; -webkit-overflow-scrolling:touch; width:100%;';
    const table = document.createElement('table');
    table.innerHTML = `<thead><tr><th>Name</th><th>Premium</th><th>Status</th><th></th></tr></thead>`;
    const tbody = document.createElement('tbody');
    state.members.forEach(m=>{
      const tr = document.createElement('tr');
      const nameTd = document.createElement('td'); nameTd.textContent = m.name;
      tr.appendChild(nameTd);
      const premTd = document.createElement('td');
      const pInp = document.createElement('input'); pInp.type='number'; pInp.value=m.premium;
      pInp.disabled = !window.isAdmin;
      pInp.oninput = async (e)=>{ m.premium = rupee(e.target.value); await persistAll(); };
      premTd.appendChild(pInp); tr.appendChild(premTd);
      const statusTd = document.createElement('td'); statusTd.textContent = m.active ? 'Active' : 'Inactive';
      tr.appendChild(statusTd);
      const actTd = document.createElement('td');
      actTd.style.cssText = 'display:flex; gap:6px; justify-content:flex-end;';

      if(window.isAdmin){
        const toggle = document.createElement('button'); toggle.className='ghost'; toggle.textContent = m.active?'Deactivate':'Reactivate';
        toggle.onclick = async ()=>{ m.active=!m.active; await persistAll(); render(); };
        actTd.appendChild(toggle);

        if(m.active){
          const exitBtn = document.createElement('button');
          exitBtn.className = 'ghost';
          exitBtn.textContent = 'Exit';
          exitBtn.title = 'Cash this member out of the fund and mark them inactive.';
          exitBtn.onclick = ()=>{ pendingMemberExit = m.id; render(); };
          actTd.appendChild(exitBtn);
        }

        const hasClosedHistory = state.months.some(mk => state.ledgers[mk] && state.ledgers[mk].entries[m.id]);
        const canDelete = !!m.addedInApp && !hasClosedHistory;
        const delBtn = document.createElement('button');
        delBtn.className = 'ghost';
        delBtn.style.color = 'var(--clay)';
        if(!canDelete){
          delBtn.textContent = 'Delete';
          delBtn.disabled = true;
          delBtn.style.opacity = '0.4';
          delBtn.style.cursor = 'not-allowed';
        } else {
          delBtn.textContent = 'Delete';
          let armed = false;
          delBtn.onclick = async ()=>{
            if(!armed){
              armed = true;
              delBtn.textContent = 'Confirm?';
              delBtn.style.background = 'var(--clay)';
              delBtn.style.color = '#fff';
              setTimeout(()=>{
                if(armed){ armed=false; delBtn.textContent='Delete'; delBtn.style.background=''; delBtn.style.color='var(--clay)'; }
              }, 4000);
              return;
            }
            const l = state.ledgers[state.currentMonth];
            if(l){
              delete l.entries[m.id];
            }
            state.members = state.members.filter(x => x.id !== m.id);
            await persistAll();
            if(l) await persistLedger(state.currentMonth);
            render();
          };
        }
        actTd.appendChild(delBtn);
      }

      tr.appendChild(actTd);
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    wrap.appendChild(table);
    body.appendChild(wrap);

  const PDF_SUMMARY_CARDS = [
    { key: 'bookValue',   label: 'Book value' },
    { key: 'nav',         label: 'NAV per member' },
    { key: 'grandTotal',  label: 'Grand total' },
    { key: 'cashInHand',  label: 'Cash in hand' },
    { key: 'openingCash', label: 'Opening cash' },
    { key: 'cashFlow',    label: 'Cash flow' },
  ];

  // Lets the admin choose which summary cards land in the exported PDF, instead of
  // always dumping all six. Opens a checkbox modal, then calls exportMonthPdf with
  // just the keys that were left checked.
  function openPdfExportOptions(monthKey){
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    const box = document.createElement('div');
    box.className = 'modal-box';

    const heading = document.createElement('h2');
    heading.textContent = 'Export Ledger';
    box.appendChild(heading);

    let format = 'pdf';
    const formatLabel = document.createElement('p');
    formatLabel.style.cssText = 'font-size:11px; color:var(--muted); font-weight:600; margin:0 0 6px; text-transform:uppercase; letter-spacing:.03em;';
    formatLabel.textContent = 'Format';
    box.appendChild(formatLabel);

    const formatRow = document.createElement('div');
    formatRow.style.cssText = 'display:flex; gap:8px; margin-bottom:14px;';
    const formatBtns = {};
    [['pdf','PDF (single A4 page)'],['image','Image (PNG)']].forEach(([key,label])=>{
      const b = document.createElement('button');
      b.type = 'button';
      b.textContent = label;
      b.style.cssText = 'flex:1; font-size:12.5px; padding:9px 8px;';
      if(key === format){ b.className = 'primary'; }
      formatBtns[key] = b;
      b.onclick = ()=>{
        format = key;
        Object.keys(formatBtns).forEach(k=>{ formatBtns[k].className = k === format ? 'primary' : ''; });
      };
      formatRow.appendChild(b);
    });
    box.appendChild(formatRow);

    const sub = document.createElement('p');
    sub.style.cssText = 'font-size:12px; color:var(--muted); margin:-4px 0 12px;';
    sub.textContent = 'Choose which summary cards to include below the ledger table.';
    box.appendChild(sub);

    const checkboxes = {};
    PDF_SUMMARY_CARDS.forEach(c=>{
      const row = document.createElement('label');
      row.style.cssText = 'display:flex; align-items:center; gap:8px; padding:6px 0; cursor:pointer; font-size:13.5px; color:var(--ink);';
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = true;
      cb.style.cssText = 'width:16px; height:16px; accent-color:var(--teal); cursor:pointer;';
      checkboxes[c.key] = cb;
      row.appendChild(cb);
      const span = document.createElement('span');
      span.textContent = c.label;
      row.appendChild(span);
      box.appendChild(row);
    });

    const btnRow = document.createElement('div');
    btnRow.className = 'row-btns';
    const exportConfirmBtn = document.createElement('button');
    exportConfirmBtn.className = 'primary';
    exportConfirmBtn.textContent = 'Export';
    exportConfirmBtn.onclick = ()=>{
      const selected = PDF_SUMMARY_CARDS.map(c=>c.key).filter(key => checkboxes[key].checked);
      document.body.removeChild(overlay);
      if(format === 'image'){ exportMonthImage(monthKey, selected); }
      else { exportMonthPdf(monthKey, selected); }
    };
    btnRow.appendChild(exportConfirmBtn);

    const cancelBtn = document.createElement('button');
    cancelBtn.className = 'secondary';
    cancelBtn.textContent = 'Cancel';
    cancelBtn.onclick = ()=>{ document.body.removeChild(overlay); };
    btnRow.appendChild(cancelBtn);

    box.appendChild(btnRow);
    overlay.appendChild(box);
    document.body.appendChild(overlay);
  }

  function buildLedgerDocument(monthKey, cardKeys, scale){
    const l = state.ledgers[monthKey];
    const s = summary(monthKey);
    if(!l || !s) return null;
    scale = scale || 1;
    const pdfFundName = "Power Friends Bank";
    const members = state.members.filter(m => m.active && l.entries[m.id]);

    const rows = members.map((m,i)=>{
      const e = l.entries[m.id];
      const hasNewLoan = safe(e.newLoanIssued) > 0;
      return `<tr${hasNewLoan ? ' class="new-loan-row"' : ''}>
        <td>${i+1}</td><td>${m.name}</td>
        <td class="num">${INR(entryPremium(e))}</td>
        <td class="num">${INR(e.previousLoanBalance)}</td>
        <td class="num">${INR(e.interest)}</td>
        <td class="num">${INR(e.loanRefund)}</td>
        <td class="num">${INR(e.newLoanIssued)}</td>
        <td class="num">${INR(e.totalCollected)}</td>
        <td class="num">${INR(e.finalLoanBalance)}</td>
        <td>${e.remark || ''}</td>
      </tr>`;
    }).join('');

    // Font/padding sizes are derived from `scale`, itself computed by the caller from
    // the member count — empirically tuned (via real Chromium print rendering) so the
    // table + summary cards land on exactly one A4 landscape page regardless of how
    // many members are in the ledger. See exportMonthPdf for how scale is chosen.
    const fontPx = (9.5*scale).toFixed(2);
    const padV = (2.5*scale).toFixed(2);
    const padH = (5*scale).toFixed(2);
    const h1Px = (16*Math.max(scale,0.7)).toFixed(2);
    const subPx = (10*Math.max(scale,0.75)).toFixed(2);
    const cardLabelPx = (8*Math.max(scale,0.75)).toFixed(2);
    const cardValuePx = (17*Math.max(scale,0.6)).toFixed(2);
    const cardPad = (7*Math.max(scale,0.7)).toFixed(2);
    const cardPadV = (9*Math.max(scale,0.7)).toFixed(2);
    const gridMargin = (14*scale).toFixed(2);

    const css = `
      #ledgerExportRoot { font-family: Cambria, Georgia, serif; font-weight: bold; color: #1a1a1a; font-size: ${subPx}px; position: relative; background:#fff; padding: 4px; }
      #ledgerExportRoot * { box-sizing: border-box; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      #ledgerExportRoot .watermark-bg { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 380px; height: auto; max-height: 380px; opacity: 0.08; z-index: 0; pointer-events: none; object-fit: contain; }
      #ledgerExportRoot h1 { font-size: ${h1Px}px; font-weight: bold; margin: 0 0 2px; position:relative; z-index:1; }
