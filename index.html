<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Power Friends Bank</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --ink: #1a1b29;
      --paper: #eef0ff;
      --paper-2: rgba(255,255,255,0.55);
      --input-bg: rgba(255,255,255,0.45);
      --rule: rgba(22,24,33,0.09);
      --rule-strong: rgba(22,24,33,0.16);
      --glass: rgba(255,255,255,0.55);
      --glass-strong: rgba(255,255,255,0.75);
      --glass-border: rgba(255,255,255,0.6);
      --glass-filter: blur(18px) saturate(180%);
      --teal: #6d5cf5;
      --teal-light: rgba(109,92,245,0.18);
      --teal-dark: #4634d1;
      --clay: #ef4d78;
      --clay-light: rgba(239,77,120,0.18);
      --muted: #52516b;
      --radius-lg: 18px;
      --radius-md: 12px;
      --radius-sm: 8px;
      --shadow-sm: 0 4px 14px rgba(31,38,135,0.10);
      --shadow-md: 0 8px 32px rgba(31,38,135,0.20);
      font-family: "Inter", "Segoe UI", sans-serif;
      font-weight: 500;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --ink: #F8FAFC;
        --paper: #0F172A;
        --paper-2: rgba(30,41,59,0.55);
        --input-bg: rgba(51,65,85,0.55);
        --rule: rgba(255,255,255,0.10);
        --rule-strong: rgba(255,255,255,0.18);
        --glass: rgba(30,41,59,0.55);
        --glass-strong: rgba(30,41,59,0.75);
        --glass-border: rgba(255,255,255,0.14);
        --muted: #94A3B8;
        --teal-light: rgba(109, 92, 245, 0.25);
        --clay-light: rgba(239, 77, 120, 0.22);
        --shadow-sm: 0 4px 14px rgba(0,0,0,0.35);
        --shadow-md: 0 10px 30px rgba(0,0,0,0.5);
      }
    }

    * { box-sizing:border-box; }
    html, body{
      margin:0; padding:0;
      min-height:100%;
      overflow-x:hidden;
      overflow-y:auto;
      -webkit-overflow-scrolling:touch;
      background:
        radial-gradient(circle at 12% 18%, rgba(167,139,250,0.55) 0%, transparent 48%),
        radial-gradient(circle at 88% 12%, rgba(103,232,249,0.45) 0%, transparent 45%),
        radial-gradient(circle at 25% 88%, rgba(244,114,182,0.4) 0%, transparent 50%),
        radial-gradient(circle at 92% 80%, rgba(109,92,245,0.35) 0%, transparent 45%),
        linear-gradient(135deg, #eef0ff 0%, #f7f0ff 100%);
      background-attachment: fixed;
      color:var(--ink);
    }
    body,div,p,span,td,th,input,button{font-family:inherit; font-weight:inherit;}
    h1,h2,h3,.display{ font-family:"Manrope","Inter",sans-serif; font-weight:800; letter-spacing:-0.01em; color:var(--ink); }

    .fb-app input[type=number]{
      font-family:"Inter",sans-serif; font-weight:600; font-variant-numeric:tabular-nums;
      background:var(--input-bg); border:1px solid var(--rule-strong); border-radius:var(--radius-sm);
      width:96px; padding:6px 8px; font-size:13.5px; text-align:right; color:var(--ink);
    }
    .fb-app input[type=text]{
      font-family:inherit; border:1.5px solid var(--rule-strong); border-radius:var(--radius-sm);
      padding:8px 10px; font-size:14px; background:var(--input-bg); color:var(--ink);
    }
    .fb-app button{
      font-family:inherit; cursor:pointer; border-radius:999px; font-size:13px; font-weight:700;
      border:1.5px solid var(--glass-border); background:var(--paper-2); padding:8px 16px;
      color:var(--ink); transition:all .15s ease;
      backdrop-filter:var(--glass-filter); -webkit-backdrop-filter:var(--glass-filter);
    }
    .fb-app button.primary{ background:var(--teal); color:#FFFFFF !important; border-color:var(--teal); box-shadow:var(--shadow-sm); backdrop-filter:none; -webkit-backdrop-filter:none; }
    .fb-app button.ghost{ border:none; background:none; padding:6px 10px; color:var(--muted); border-radius:var(--radius-sm); backdrop-filter:none; -webkit-backdrop-filter:none; }

    .fb-app table{ border-collapse:collapse; width:100%; font-size:13px; }
    .fb-app th{
      font-family:"Inter",sans-serif; font-weight:700; text-align:right; padding:10px;
      border-bottom:2px solid var(--rule-strong); color:var(--muted); font-size:11px; text-transform:uppercase;
    }
    .fb-app th:first-child, .fb-app th:nth-child(2){ text-align:left; }
    .fb-app td{ padding:9px 10px; border-bottom:1px solid var(--rule); text-align:right; color:var(--ink); }
    .fb-app td:first-child, .fb-app td:nth-child(2){ text-align:left; }
    .fb-app tr:hover td{ background:var(--input-bg); }
    .fb-app tfoot td{ border-top:2px solid var(--ink); border-bottom:none; font-weight:700; }

    .num{ font-family:"Inter",sans-serif; font-weight:700; font-variant-numeric:tabular-nums; }
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}

    /* Auth Screen & Topbar */
    .auth-screen{
      min-height:100vh; display:flex; align-items:center; justify-content:center;
      background:
        radial-gradient(circle at 20% 20%, rgba(167,139,250,0.6) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(103,232,249,0.5) 0%, transparent 50%),
        linear-gradient(135deg, #eef0ff 0%, #f7f0ff 100%);
      padding:24px; font-family:"Inter",sans-serif;
    }
    .auth-box{
      width:100%; max-width:360px; background:var(--glass-strong); border-radius:var(--radius-lg); padding:32px 28px;
      box-shadow:var(--shadow-md); border:1px solid var(--glass-border);
      backdrop-filter:var(--glass-filter); -webkit-backdrop-filter:var(--glass-filter);
    }
    .auth-box h1{ font-size:22px; color:var(--ink); margin:0 0 4px; }
    .auth-box p.sub{ color:var(--muted); font-size:13px; margin:0 0 20px; }
    .auth-box input{
      width:100%; padding:12px 14px; margin-bottom:12px; font-size:14px;
      border:1.5px solid var(--rule-strong); border-radius:var(--radius-md); background:var(--input-bg); color:var(--ink);
    }
    .auth-box button{
      width:100%; padding:13px; font-size:14px; font-weight:700; border:none; border-radius:999px;
      background:var(--teal); color:#FFFFFF !important; cursor:pointer; box-shadow:var(--shadow-sm);
    }
    .auth-error{ color:var(--clay); font-size:13px; margin:-4px 0 12px; display:none; }
    .auth-error.show{ display:block; }

    .app-topbar{
      display:flex; align-items:center; justify-content:flex-end; gap:8px;
      padding:12px 16px; background:var(--glass); font-size:13px; border-bottom:1px solid var(--glass-border);
      position:sticky; top:0; z-index:100; color:var(--ink);
      backdrop-filter:var(--glass-filter); -webkit-backdrop-filter:var(--glass-filter);
    }
    .app-topbar .user-label{ margin-right:auto; color:var(--muted); font-weight:600; }
    .app-topbar button{
      background:var(--input-bg); border:1px solid var(--rule-strong); color:var(--ink);
      border-radius:999px; padding:7px 13px; font-size:12px; font-weight:700; cursor:pointer;
      backdrop-filter:none; -webkit-backdrop-filter:none;
    }

    .modal-overlay{
      position:fixed; inset:0; background:rgba(20,17,45,0.45); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
      display:flex; align-items:center; justify-content:center; padding:20px; z-index:1000;
    }
    .modal-box{
      background:var(--glass-strong); border-radius:var(--radius-lg); padding:24px; width:100%; max-width:420px;
      max-height:85vh; overflow:auto; box-shadow:var(--shadow-md); border:1px solid var(--glass-border); color:var(--ink);
      backdrop-filter:var(--glass-filter); -webkit-backdrop-filter:var(--glass-filter);
    }
    .modal-box h2{ font-size:18px; color:var(--ink); margin:0 0 16px; }
    .modal-box input{
      width:100%; padding:10px 12px; margin-bottom:10px; font-size:14px;
      border:1.5px solid var(--rule-strong); border-radius:var(--radius-md); background:var(--input-bg); color:var(--ink);
    }
    .modal-box .row-btns{ display:flex; gap:8px; margin-top:6px; }
    .modal-box button.primary{ flex:1; padding:11px; border:none; border-radius:999px; background:var(--teal); color:#FFFFFF !important; font-weight:700; }
    .modal-box button.secondary{ padding:10px 14px; border:1.5px solid var(--rule-strong); border-radius:999px; background:var(--paper-2); color:var(--ink); font-weight:700; }
    .modal-msg{ font-size:13px; margin:8px 0; display:none; }
    .modal-msg.show{ display:block; }
    .modal-msg.err{ color:var(--clay); }
    .modal-msg.ok{ color:var(--teal); }
    .member-row{ font-size:13px; padding:6px 0; border-bottom:0.5px solid var(--rule); display:flex; justify-content:space-between; color:var(--ink); }

    /* FIXED NON-SCROLLING BOTTOM ACTION PANEL */
    .ledger-bottom-panel {
      position: fixed;
      bottom: 58px;
      left: 12px;
      right: 12px;
      z-index: 180;
      background: var(--glass-strong);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-lg);
      padding: 8px 12px;
      box-shadow: var(--shadow-md);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      backdrop-filter: var(--glass-filter);
      -webkit-backdrop-filter: var(--glass-filter);
    }
    .ledger-icon-btn {
      min-width: 40px;
      height: 40px;
      padding: 0 12px;
      font-size: 14px;
      font-weight: 700;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border: 1px solid var(--rule-strong);
      background: var(--input-bg);
      color: var(--ink);
      box-shadow: var(--shadow-sm);
    }
    .ledger-icon-btn:active {
      transform: scale(0.95);
    }
  </style>
</head>
<body>

<div id="auth-screen" class="auth-screen">
  <div class="auth-box">
    <h1>Power Friends Bank</h1>
    <p class="sub">Sign in with the account your fund admin gave you.</p>
    <input id="authEmail" type="email" placeholder="Email" autocomplete="username" />
    <input id="authPassword" type="password" placeholder="Password" autocomplete="current-password" />
    <p id="authError" class="auth-error"></p>
    <button id="authLoginBtn" type="button">Log In</button>
  </div>
</div>

<div id="appTopbar" class="app-topbar" style="display:none;">
  <span id="userLabel" class="user-label"></span>
  <button id="refreshBtn">Refresh</button>
  <button id="changePasswordBtn">Change Password</button>
  <button id="manageMembersBtn" style="display:none;">Manage Members</button>
  <button id="signOutBtn">Sign Out</button>
</div>

<div class="fb-app" id="fbAppContainer" style="display:none; padding: 12px;">
  <h2 class="sr-only">Power Friends Bank</h2>
  <div id="fb-root" style="min-height:200px;">
    <p style="text-align:center; color:var(--muted); padding:3rem 0; font-style:italic;">Opening the ledger…</p>
  </div>
</div>

<div id="manageMembersModal" class="modal-overlay" style="display:none;">
  <div class="modal-box">
    <h2>Manage members</h2>
    <input id="newMemberName" type="text" placeholder="Full name" />
    <input id="newMemberEmail" type="email" placeholder="Email" />
    <input id="newMemberPassword" type="password" placeholder="Temporary password (min 6 characters)" />
    <input id="newMemberPremium" type="number" placeholder="Monthly premium" value="500" />
    <p id="newMemberMsg" class="modal-msg"></p>
    <div class="row-btns">
      <button id="createMemberBtn" class="primary" type="button">Create Account</button>
      <button id="closeMembersModalBtn" class="secondary" type="button">Close</button>
    </div>
    <div id="memberListing" style="margin-top:16px;"></div>
  </div>
</div>

<div id="changePasswordModal" class="modal-overlay" style="display:none;">
  <div class="modal-box">
    <h2>Change password</h2>
    <input id="currentPasswordField" type="password" placeholder="Current password" autocomplete="current-password" />
    <input id="newPasswordField" type="password" placeholder="New password (min 6 characters)" autocomplete="new-password" />
    <input id="confirmPasswordField" type="password" placeholder="Confirm new password" autocomplete="new-password" />
    <p id="changePasswordMsg" class="modal-msg"></p>
    <div class="row-btns">
      <button id="submitChangePasswordBtn" class="primary" type="button">Update Password</button>
      <button id="closeChangePasswordModalBtn" class="secondary" type="button">Close</button>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
  (function(){
    if (typeof window.AndroidStorage === 'undefined') return;
    const pending = {};
    let counter = 0;
    window.__storageResolve = function(id, resultJson){
      const entry = pending[id];
      if(!entry) return;
      delete pending[id];
      entry.resolve(resultJson === undefined ? null : resultJson);
    };
    function call(method, args){
      return new Promise((resolve, reject)=>{
        const id = 'r' + (counter++) + '_' + Date.now();
        pending[id] = {resolve, reject};
        try{ window.AndroidStorage[method](...args, id); }
        catch(e){ delete pending[id]; reject(e); }
      });
    }
    window.storage = {
      set: (key, value, shared) => call('set', [key, value, !!shared]),
      get: (key, shared) => call('get', [key, !!shared]),
      delete: (key, shared) => call('delete', [key, !!shared]),
      list: (prefix, shared) => call('list', [prefix || '', !!shared])
    };
  })();
</script>

<script>
  (function(){
    const pending = {};
    let counter = 0;
    window.__accountCreationResolve = function(id, resultJson){
      const entry = pending[id];
      if(!entry) return;
      delete pending[id];
      entry.resolve(resultJson === undefined ? null : resultJson);
    };
    window.nativeCreateAccount = function(name, email, password){
      return new Promise((resolve, reject) => {
        if (typeof window.AndroidAccountCreation !== 'undefined') {
          const id = 'acct' + (counter++) + '_' + Date.now();
          pending[id] = {resolve, reject};
          try { window.AndroidAccountCreation.createAccount(name, email, password, id); }
          catch(e){ delete pending[id]; reject(e); }
          return;
        }
        // Browser fallback: create the new member's Firebase Auth account on
        // an isolated secondary Firebase app instance so it doesn't sign the
        // admin out of their own session — mirrors what MainActivity's
        // AccountCreationBridge does natively via a secondary FirebaseApp.
        if (typeof firebase === 'undefined' || !firebase.apps || !firebase.apps.length) {
          reject(new Error('Not signed in.'));
          return;
        }
        let secondaryApp;
        try { secondaryApp = firebase.app('MemberCreation'); }
        catch(e) { secondaryApp = firebase.initializeApp(firebase.app().options, 'MemberCreation'); }
        const secondaryAuth = secondaryApp.auth();
        secondaryAuth.createUserWithEmailAndPassword(email, password)
          .then(function(result){
            const uid = result.user && result.user.uid;
            return secondaryAuth.signOut().then(function(){ return uid; });
          })
          .then(function(uid){
            if(!uid){ reject(new Error("Account created but couldn't read its ID.")); return; }
            firebase.firestore().collection('funds').doc(FUND_ID).collection('members').doc(uid)
              .set({ name: name, email: email, role: 'member' })
              .then(function(){ resolve({ uid: uid }); })
              .catch(function(e){ reject(new Error('Account was created, but saving profile failed: ' + e.message)); });
          })
          .catch(function(e){ reject(new Error(e.message || "Couldn't create account.")); });
      });
    };
  })();
</script>

<script>
  const FIREBASE_CONFIG = {
    apiKey: "AIzaSyAHkxdE_ewtp-_k2-N8KiHPIhmkdJpoGCw",
    authDomain: "btps-fb.firebaseapp.com",
    projectId: "btps-fb",
    storageBucket: "btps-fb.firebasestorage.app",
    messagingSenderId: "412141689884",
    appId: "1:412141689884:web:852956b59c7be02ea193d9"
  };
  const FUND_ID = "main_fund";

  (function(){
    const inAndroidApp = (typeof window.AndroidStorage !== 'undefined');

    const authScreen = document.getElementById('auth-screen');
    const topbar = document.getElementById('appTopbar');
    const appContainer = document.getElementById('fbAppContainer');
    const userLabel = document.getElementById('userLabel');
    const manageBtn = document.getElementById('manageMembersBtn');
    const signOutBtn = document.getElementById('signOutBtn');
    const refreshBtn = document.getElementById('refreshBtn');
    const authError = document.getElementById('authError');
    const emailInput = document.getElementById('authEmail');
    const passwordInput = document.getElementById('authPassword');
    const loginBtn = document.getElementById('authLoginBtn');

    // Manage Members modal (browser-only equivalent of the native app's
    // "Add Member" menu item — both paths funnel into the same
    // window.__beginAddMemberWithAccount entry point in the ledger app below,
    // so the join flow behaves identically either way).
    const manageMembersModal = document.getElementById('manageMembersModal');
    const newMemberName = document.getElementById('newMemberName');
    const newMemberEmail = document.getElementById('newMemberEmail');
    const newMemberPassword = document.getElementById('newMemberPassword');
    const newMemberPremium = document.getElementById('newMemberPremium');
    const newMemberMsg = document.getElementById('newMemberMsg');
    const createMemberBtn = document.getElementById('createMemberBtn');
    const closeMembersModalBtn = document.getElementById('closeMembersModalBtn');

    // Change Password modal
    const changePasswordModal = document.getElementById('changePasswordModal');
    const currentPasswordField = document.getElementById('currentPasswordField');
    const newPasswordField = document.getElementById('newPasswordField');
    const confirmPasswordField = document.getElementById('confirmPasswordField');
    const changePasswordMsg = document.getElementById('changePasswordMsg');
    const submitChangePasswordBtn = document.getElementById('submitChangePasswordBtn');
    const closeChangePasswordModalBtn = document.getElementById('closeChangePasswordModalBtn');

    if (inAndroidApp) {
      authScreen.style.display = 'none';
      topbar.style.display = 'none';
      appContainer.style.display = '';
      window.addEventListener('load', function(){ window.__startLedgerApp(); });
      return;
    }

    firebase.initializeApp(FIREBASE_CONFIG);
    const auth = firebase.auth();
    const db = firebase.firestore();
    let isAdmin = false;

    function showApp(user){
      authScreen.style.display = 'none';
      topbar.style.display = 'flex';
      appContainer.style.display = '';
      userLabel.textContent = user.email;
    }
    function showLogin(){
      authScreen.style.display = 'flex';
      topbar.style.display = 'none';
      appContainer.style.display = 'none';
    }

    function installFirestoreStorage(){
      const dataCol = () => db.collection('funds').doc(FUND_ID).collection('data');
      window.storage = {
        async set(key, value){
          await dataCol().doc(key).set({ value });
          return { key, value, shared:false };
        },
        async get(key){
          const doc = await dataCol().doc(key).get();
          if(!doc.exists) return null;
          return { key, value: doc.data().value, shared:false };
        },
        async delete(key){
          await dataCol().doc(key).delete();
          return { key, deleted:true, shared:false };
        },
        async list(prefix){
          let query = dataCol();
          if(prefix){
            const end = prefix.slice(0,-1) + String.fromCharCode(prefix.charCodeAt(prefix.length-1)+1);
            query = query.orderBy(firebase.firestore.FieldPath.documentId()).startAt(prefix).endBefore(end);
          }
          const snap = await query.get();
          return { keys: snap.docs.map(d=>d.id) };
        }
      };
    }

    auth.onAuthStateChanged(function(user){
      if(!user){ showLogin(); return; }
      showApp(user);
      db.collection('funds').doc(FUND_ID).collection('members').doc(user.uid).get()
        .then(function(doc){
          isAdmin = doc.exists && doc.data().role === 'admin';
          manageBtn.style.display = isAdmin ? '' : 'none';
          const resolvedName = (doc.exists && doc.data().name) || user.displayName || user.email || '';
          userLabel.textContent = resolvedName;
          window.__setIsAdmin(isAdmin);
          window.__setLoggedInMemberName(resolvedName);
        });
      installFirestoreStorage();
      window.__startLedgerApp();
    });

    loginBtn.addEventListener('click', function(){
      const email = emailInput.value.trim();
      const password = passwordInput.value;
      authError.classList.remove('show');
      if(!email || !password){
        authError.textContent = 'Enter both your email and password.';
        authError.classList.add('show');
        return;
      }
      loginBtn.disabled = true;
      auth.signInWithEmailAndPassword(email, password)
        .catch(function(err){
          authError.textContent = err.message || "Couldn't sign in.";
          authError.classList.add('show');
        })
        .finally(function(){ loginBtn.disabled = false; });
    });

    signOutBtn.addEventListener('click', function(){ auth.signOut(); });
    refreshBtn.addEventListener('click', function(){ window.location.reload(); });

    manageBtn.addEventListener('click', function(){
      newMemberName.value = '';
      newMemberEmail.value = '';
      newMemberPassword.value = '';
      newMemberPremium.value = '500';
      newMemberMsg.classList.remove('show', 'err', 'ok');
      newMemberMsg.textContent = '';
      manageMembersModal.style.display = 'flex';
    });
    closeMembersModalBtn.addEventListener('click', function(){ manageMembersModal.style.display = 'none'; });

    createMemberBtn.addEventListener('click', function(){
      const name = newMemberName.value.trim();
      const email = newMemberEmail.value.trim();
      const password = newMemberPassword.value;
      const premium = parseInt(newMemberPremium.value, 10) || 500;
      newMemberMsg.classList.remove('show', 'err', 'ok');

      if(!name || !email || password.length < 6){
        newMemberMsg.textContent = "Fill in the member's name, a valid email, and a password of at least 6 characters.";
        newMemberMsg.classList.add('show', 'err');
        return;
      }
      // Hand off to the exact same entry point the native Android app uses
      // (see MainActivity's addMemberLauncher) — this keeps the join flow
      // (Pay NAV / NAV loan) identical between the app and the browser.
      manageMembersModal.style.display = 'none';
      window.__beginAddMemberWithAccount(name, email, password, premium);
    });

    changePasswordBtn.addEventListener('click', function(){
      currentPasswordField.value = '';
      newPasswordField.value = '';
      confirmPasswordField.value = '';
      changePasswordMsg.classList.remove('show', 'err', 'ok');
      changePasswordMsg.textContent = '';
      changePasswordModal.style.display = 'flex';
    });
    closeChangePasswordModalBtn.addEventListener('click', function(){ changePasswordModal.style.display = 'none'; });

    submitChangePasswordBtn.addEventListener('click', function(){
      const user = auth.currentUser;
      if(!user) return;
      const current = currentPasswordField.value;
      const newPass = newPasswordField.value;
      const confirm = confirmPasswordField.value;
      changePasswordMsg.classList.remove('show', 'err', 'ok');

      if(!current || newPass.length < 6){
        changePasswordMsg.textContent = 'Enter your current password and a new password of at least 6 characters.';
        changePasswordMsg.classList.add('show', 'err');
        return;
      }
      if(newPass !== confirm){

  const rupee = n => isFinite(n) ? Math.round(n) : 0;
  const safe = v => (isFinite(v) && !isNaN(v)) ? Number(v) : 0;

  // COMPACT ALPHANUMERIC FORMATTER FOR CHART FIGURES
  const fmtShort = n => {
    n = safe(n);
    if(n === 0) return '₹0';
    const abs = Math.abs(n);
    const sign = n < 0 ? '-' : '';
    if(abs >= 100000) return sign + '₹' + (abs/100000).toFixed(abs % 100000 === 0 ? 0 : 1) + 'L';
    if(abs >= 1000) return sign + '₹' + (abs/1000).toFixed(abs % 1000 === 0 ? 0 : 1) + 'K';
    return sign + '₹' + abs;
  };

  // Rounds a value up to a "nice" round number (1/2/5/10 × 10^n) so a chart axis
  // built from it lands on clean tick values instead of an arbitrary raw maximum —
  // this is what lets small month-to-month changes stay visually legible.
  const niceCeil = v => {
    v = Math.max(1, safe(v));
    const exp = Math.floor(Math.log10(v));
    const base = Math.pow(10, exp);
    const norm = v / base;
    let niceNorm;
    if(norm <= 1) niceNorm = 1;
    else if(norm <= 2) niceNorm = 2;
    else if(norm <= 5) niceNorm = 5;
    else niceNorm = 10;
    return niceNorm * base;
  };

  const hasAppStorage = (typeof window.storage !== 'undefined' && window.storage

  async function save(key, value){
    try{
      if(hasAppStorage) await window.storage.set(key, JSON.stringify(value), false);

        const r = await window.storage.list(prefix, false);
        return r ? r.keys : [];

        const keys = [];
        for(let i=0;i<localStorage.length;i++){
          const k = localStorage.key(i);
          if(k && k.startsWith(prefix)) keys.push(k);
        }
        return keys;
      }

  }

  async function persistAll(){

      save('fb:meta', {fundName: state.fundName, interestRate: state.interestRate, months: state.months, currentMonth: state.currentMonth}),
      save('fb:members', state.members),

  async function persistLoanRequests(){ await save('fb:loanRequests', state.loanRequests); }
  async function persistLoanRequestLog(){ await save('fb:loanRequestLog', state.loanRequestLog); }

  // Who is performing this action right now — the logged-in member's own record if we can
  // resolve it, otherwise the raw login name, otherwise a generic fallback. Used so the
  // loan request log can show exactly who created or cancelled a request.
  function currentActorName(){
    const lm = findLoggedInLiveMember();
    if(lm) return lm.name;
    if(window.__loggedInMemberName) return window.__loggedInMemberName;
    return window.isAdmin ? 'Admin' : 'Unknown user';
  }

  // Appends an entry to the shared loan-request log. Logging is best-effort: if it fails
  // (e.g. a rules problem on the log document), the underlying request action has already
  // succeeded and must not be undone or blocked because of it.
  async function appendLoanRequestLog(action, req){
    try{
      state.loanRequestLog.push({
        id: uid(),
        action,                        // 'created' | 'cancelled'
        memberName: req.memberName,    // whose request this is
        amount: req.amount,
        byName: currentActorName(),    // who actually did it
        timestamp: new Date().toISOString(),
      });
      await persistLoanRequestLog();
    } catch(err){
      console.error('appendLoanRequestLog failed:', err);
    }
  }

  function computeEntry(prevBalance, premium, rate, loanRefund, newLoan, carried, remark){
    prevBalance = rupee(prevBalance); loanRefund = rupee(loanRefund); newLoan = rupee(newLoan);
    const interest = rupee(prevBalance * rate / 100);
    const totalCollected = rupee(premium + interest + loanRefund);
    const finalBalance = rupee(prevBalance - loanRefund + newLoan);
    return { previousLoanBalance: prevBalance, interest, loanRefund, newLoanIssued: newLoan, totalCollected, finalLoanBalance: finalBalance, carried: !!carried, remark: remark || '' };
  }

  function dividendAppliedToLoan(finalBalance, dividendPerMember){ return Math.min(rupee(dividendPerMember || 0), rupee(finalBalance)); }

  // The premium actually collected for a given entry, derived from its own stored
  // totalCollected/interest/loanRefund (which always satisfy totalCollected =
  // premium + interest + loanRefund by construction in computeEntry) rather than
  // read live off member.premium. Editing a member's premium in the Members tab
  // must only affect brand-new entries going forward — it should never silently
  // reach back and change what a closed (or already-saved) month displays.
  function entryPremium(e){ return rupee(safe(e.totalCollected) - safe(e.interest) - safe(e.loanRefund)); }

  // Resolves the currently logged-in person to their own live member record, by
  // matching window.__loggedInMemberName (set by native/browser login) against
  // state.members. Used by Loan Requests so a non-admin member can only request
  // (or cancel) a loan for themselves, never on someone else's behalf.
  const normNameLooseTop = s => (s||'').toUpperCase().replace(/[^A-Z]/g,'');
  function findLoggedInLiveMember(){
    const loggedInNorm = normNameLooseTop(window.__loggedInMemberName);
    if(!loggedInNorm) return null;
    return state.members.find(mm => normNameLooseTop(mm.name) === loggedInNorm) || null;
  }
  function balanceAfterDividend(finalBalance, dividendPerMember){ return rupee(finalBalance) - dividendAppliedToLoan(finalBalance, dividendPerMember); }

  function ensureCurrentMonthLedger(){
    const key = state.currentMonth;
    if(!state.ledgers[key]){
      const lastClosed = state.months[state.months.length - 1];
      const entries = {};
      state.members.forEach(m=>{
        const hasHistory = lastClosed && state.ledgers[lastClosed] && state.ledgers[lastClosed].entries[m.id];
        const prevLedger = hasHistory ? state.ledgers[lastClosed] : null;
        const prevFinalRaw = hasHistory ? prevLedger.entries[m.id].finalLoanBalance : 0;
        const prevFinal = (prevLedger && m.active)
          ? balanceAfterDividend(prevFinalRaw, prevLedger.dividendPerMember)
          : prevFinalRaw;
        entries[m.id] = computeEntry(prevFinal, m.premium, state.interestRate, 0, 0, !!hasHistory, '');
        entries[m.id].paid = false; // payment confirmation resets fresh each month
      });
      let openingCash = 0, openingCashLocked = false;
      if(lastClosed && state.ledgers[lastClosed]){
        openingCash = summary(lastClosed).cashInHand;
        openingCashLocked = true;
      }
      state.ledgers[key] = { closed:false, openingCash, openingCashLocked, touched:false, entries, dividendPerMember: 0 };
    } else {
      state.members.forEach(m=>{
        if(!state.ledgers[key].entries[m.id]){
          state.ledgers[key].entries[m.id] = computeEntry(0, m.premium, state.interestRate, 0, 0, false, '');
          state.ledgers[key].entries[m.id].paid = false;
        } else {
          if (state.ledgers[key].entries[m.id].remark === undefined) {
            state.ledgers[key].entries[m.id].remark = '';
          }
          if (state.ledgers[key].entries[m.id].paid === undefined) {
            state.ledgers[key].entries[m.id].paid = false;
          }
        }
      });
      if(state.ledgers[key].openingCash === undefined){ state.ledgers[key].openingCash = 0; state.ledgers[key].openingCashLocked = false; }
      if(state.ledgers[key].touched === undefined){ state.ledgers[key].touched = true; }
      if(state.ledgers[key].dividendPerMember === undefined){ state.ledgers[key].dividendPerMember = 0; }
    }
  }

  // Active members who haven't yet had this month's payment confirmed (see the
  // "paid" flag set from the ledger row edit modal). Used to show a pending count
  // on the Dashboard/Ledger and to gate the Close Month button.
  function pendingPaymentCount(){
    const l = state.ledgers[state.currentMonth];
    if(!l) return 0;
    return state.members.filter(m => m.active && !(l.entries[m.id] && l.entries[m.id].paid)).length;
  }

  // Exit payout basis: the member's equal share of the fund as of the LAST
  // CLOSED month's NAV (a locked, audited figure), adjusted only for what this
  // one member has personally added or still owes since that close — their own
  // current-month premium (fresh capital they put in) minus their own current
  // outstanding loan balance (debt still owed back to the fund, netted out of
  // their payout rather than collected separately). We deliberately do NOT use
  // the current month's live NAV as the basis, since it's a fund-wide aggregate
  // that keeps moving until the month closes — see design note below.
  function computeExitPayout(memberId){
    const m = state.members.find(x=>x.id===memberId);
    if(!m) return null;
    const lastClosedKey = state.months[state.months.length - 1];
    const basisMonthKey = lastClosedKey || state.currentMonth;
    const basisSummary = summary(basisMonthKey);
    const basisNav = basisSummary ? rupee(basisSummary.nav) : 0;
    const l = state.ledgers[state.currentMonth];
    const e = l ? l.entries[m.id] : null;
    const premiumThisMonth = (e && basisMonthKey !== state.currentMonth) ? rupee(m.premium) : 0;
    const outstandingNow = e ? rupee(e.finalLoanBalance) : 0;
    const payout = rupee(basisNav + premiumThisMonth - outstandingNow);
    return { basisNav, basisMonthKey, basisIsClosedMonth: !!lastClosedKey, premiumThisMonth, outstandingNow, payout };
  }

  // Interest is pooled and lifts everyone's NAV equally, regardless of who personally
  // paid it — so "how much interest have I benefited from that others paid" isn't a
  // stored figure, it has to be reconstructed: each month, take that member's equal
  // share of the TOTAL interest collected fund-wide, and compare it against what they
  // personally paid in interest that same month. Summed across every month, that
  // gives a fair, traceable answer without needing to unpack dividends by source.
  //
  // Covers two sources: the imported historical series (MEMBER_HISTORY, now carrying
  // a real per-month interest figure pulled from the fund's original Excel records,
  // with HISTORICAL_MONTHLY_INTEREST giving the fund-wide pool total/active count for
  // each of those months) plus any month tracked live in this app since. historicalSeries
  // is optional — pass it (allHistory[key].series) when known so the full membership
  // history is covered, not just live months.
  function memberInterestContribution(memberId, historicalSeries){
    let ownInterest = 0, poolShare = 0, monthsCounted = 0, firstMonth = null;
    let lastStaticMonth = null;

    if(historicalSeries && historicalSeries.length){
      historicalSeries.forEach(pt=>{
        if(pt.interest === undefined || pt.interest === null) return;
        const pool = HISTORICAL_MONTHLY_INTEREST[pt.m];
        if(!pool || !pool.activeCount) return;
        ownInterest += safe(pt.interest);
        poolShare += safe(pool.totalInterest) / pool.activeCount;
        monthsCounted++;
        if(!firstMonth || pt.m < firstMonth) firstMonth = pt.m;
      });
      lastStaticMonth = historicalSeries[historicalSeries.length - 1].m;
    }

    const liveMonths = state.months.concat(state.ledgers[state.currentMonth] ? [state.currentMonth] : []);
    liveMonths.forEach(monthKey=>{
      if(lastStaticMonth && monthKey <= lastStaticMonth) return; // already covered above
      const l = state.ledgers[monthKey];
      const e = l ? l.entries[memberId] : null;
      if(!e) return;
      const s = summary(monthKey);
      if(!s || s.activeCount === 0) return;
      ownInterest += safe(e.interest);
      poolShare += safe(s.totalInterest) / s.activeCount;
      monthsCounted++;
      if(!firstMonth || monthKey < firstMonth) firstMonth = monthKey;
    });

    return {
      ownInterest: rupee(ownInterest),
      poolShare: rupee(poolShare),
      benefitFromOthers: rupee(poolShare - ownInterest),
      monthsCounted,
      firstMonth,
    };
  }

  function summary(monthKey){
    const l = state.ledgers[monthKey];
    if(!l) return null;
    let totalPremium=0, totalInterest=0, totalRefund=0, totalNewLoans=0, totalCollected=0, totalOutstanding=0, totalPrevBalance=0, activeCount=0, outstandingLoanCount=0;
    let totalDividendAppliedToLoans=0, totalDividendPaidCash=0, totalExitPayouts=0;
    let noLoanMemberCount = 0, dividendEligibleCount = 0;
    const perMemberDividend = rupee(l.dividendPerMember || 0);

    state.members.forEach(m=>{
      const e = l.entries[m.id]; if(!e) return;
      totalPremium += m.active ? entryPremium(e) : 0;
      totalInterest += safe(e.interest);
      totalRefund += safe(e.loanRefund);
      totalNewLoans += safe(e.newLoanIssued);
      totalCollected += safe(e.totalCollected);
      totalPrevBalance += safe(e.previousLoanBalance);
      totalExitPayouts += safe(e.exitPayout);
      if(m.active) activeCount++;

      // A member's very first tracked month (no carried-forward balance yet) never
      // participates in that same month's dividend distribution — they weren't part
      // of the fund's book value the dividend was actually calculated from. Without
      // this, someone joining mid-month (e.g. via Pay NAV) with a zero loan balance
      // would be swept in as a "no-loan" cash recipient for a dividend that predates
      // their membership entirely.
      const dividendEligible = m.active && !!e.carried;
      if(dividendEligible) dividendEligibleCount++;
      const appliedToLoan = dividendEligible ? dividendAppliedToLoan(e.finalLoanBalance, perMemberDividend) : 0;
      const paidCash = dividendEligible ? rupee(perMemberDividend - appliedToLoan) : 0;
      const adjustedBalance = rupee(e.finalLoanBalance - appliedToLoan);
      totalDividendAppliedToLoans += appliedToLoan;
      totalDividendPaidCash += paidCash;
      totalOutstanding += adjustedBalance;
      if(adjustedBalance > 0) {
        outstandingLoanCount++;
      } else if(dividendEligible) {
        noLoanMemberCount++;
      }
    });

    const openingCash = rupee(l.openingCash);
    const grandTotal = rupee(openingCash + totalCollected);
    const dividendPerMember = perMemberDividend;
    const totalDividend = rupee(dividendPerMember * dividendEligibleCount);
    totalDividendPaidCash = rupee(totalDividendPaidCash);
    totalDividendAppliedToLoans = rupee(totalDividendAppliedToLoans);
    totalExitPayouts = rupee(totalExitPayouts);
    const cashInHand = rupee(grandTotal - totalNewLoans - totalDividendPaidCash - totalExitPayouts);
    const cashFlow = rupee(totalCollected - totalNewLoans - totalDividendPaidCash - totalExitPayouts);
    const bookValue = rupee(totalOutstanding + cashInHand);
    const nav = activeCount > 0 ? bookValue / activeCount : 0;

    const maxDividendPerMember = noLoanMemberCount > 0 ? Math.floor(cashInHand / noLoanMemberCount) : 0;

    return {totalPremium, totalInterest, totalRefund, totalNewLoans, totalCollected, totalOutstanding, totalPrevBalance,
      openingCash, grandTotal, cashInHand, cashFlow, bookValue, nav, activeCount, dividendPerMember: perMemberDividend,
      totalDividend, totalDividendAppliedToLoans, totalDividendPaidCash, totalExitPayouts, noLoanMemberCount, maxDividendPerMember, outstandingLoanCount};
  }

  function recomputeForward(editedMonthKey){
    const months = orderedMonths();
    const idx = months.indexOf(editedMonthKey);
    if(idx === -1) return [];
    const touchedKeys = [];
    for(let i = idx; i < months.length - 1; i++){
      const curKey = months[i];
      const nextKey = months[i + 1];
      const curLedger = state.ledgers[curKey];
      const nextLedger = state.ledgers[nextKey];
      if(!curLedger || !nextLedger) continue;
      const curSummary = summary(curKey);
      if(nextLedger.openingCashLocked){
        nextLedger.openingCash = curSummary.cashInHand;
      }
      state.members.forEach(m=>{
        const nextEntry = nextLedger.entries[m.id];
        const curEntry = curLedger.entries[m.id];
        if(!nextEntry || !curEntry) return;
        if(nextEntry.carried){
          const adjustedPrev = m.active
            ? balanceAfterDividend(curEntry.finalLoanBalance, curLedger.dividendPerMember)
            : curEntry.finalLoanBalance;
          nextLedger.entries[m.id] = computeEntry(adjustedPrev, m.premium, state.interestRate, nextEntry.loanRefund, nextEntry.newLoanIssued, true, nextEntry.remark || '');
        }
      });
      touchedKeys.push(nextKey);
    }
    return touchedKeys;
  }

  async function persistFromMonth(editedMonthKey){
    const touchedKeys = recomputeForward(editedMonthKey);
    await persistLedger(editedMonthKey);
    for(const k of touchedKeys){ await persistLedger(k); }
  }

  async function deleteMonth(monthKey){
    if(!state.months.includes(monthKey)) return;
    const months = orderedMonths();
    const idx = months.indexOf(monthKey);
    if(idx === -1) return;
    const prevKey = idx > 0 ? months[idx - 1] : null;
    const toDelete = months.slice(idx);

    for(const k of toDelete){
      delete state.ledgers[k];
      await deleteLedgerStorage(k);
    }
    state.months = state.months.filter(k => !toDelete.includes(k));

    if(prevKey){
      state.currentMonth = prevKey;
      state.ledgers[prevKey].closed = false;
    } else {
      state.currentMonth = monthKey;
    }
    ensureCurrentMonthLedger();
    await persistAll();
    await persistLedger(state.currentMonth);
  }
